<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Recovery Agent — Dashboard</title>
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0f1a;--card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07);--bdr:rgba(255,255,255,.08);--bdr-h:rgba(255,255,255,.15);--txt:#f1f5f9;--sec:#94a3b8;--dim:#64748b;--grn:#22c55e;--blu:#3b82f6;--pur:#a78bfa;--red:#ef4444;--yel:#eab308;--cyn:#06b6d4;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh}
        @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideR{from{width:0}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        .a-fu{animation:fadeUp .5s ease both}.a-fi{animation:fadeIn .4s ease both}.a-sc{animation:scaleIn .4s ease both}
        .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}

        /* Layout */
        .layout{display:flex;min-height:100vh}
        .sidebar{width:220px;background:rgba(255,255,255,.02);border-right:1px solid var(--bdr);padding:20px 0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:50}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid var(--bdr);margin-bottom:16px}
        .sidebar-logo h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
        .sidebar-logo .sub{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
        .nav{padding:0 12px;flex:1}
        .nav-section{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;padding:8px 12px;font-weight:700}
        .nav-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sec);transition:all .15s;display:flex;align-items:center;gap:10px;margin-bottom:2px}
        .nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
        .nav-item.active{background:rgba(59,130,246,.12);color:var(--blu);font-weight:600}
        .nav-item .icon{font-size:16px;width:20px;text-align:center}
        .sidebar-footer{padding:16px 20px;border-top:1px solid var(--bdr);font-size:10px;color:var(--dim)}
        .main{flex:1;margin-left:220px;padding:0}
        .topbar{background:rgba(10,15,26,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:12px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .tb-left{display:flex;align-items:center;gap:14px}
        .tb-right{display:flex;align-items:center;gap:10px}
        .badge{font-size:9px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid rgba(34,197,94,.4);color:var(--grn);text-transform:uppercase;font-weight:700}
        .badge.warn{border-color:rgba(234,179,8,.4);color:var(--yel)}
        .badge.live{border-color:rgba(59,130,246,.4);color:var(--blu);animation:pulse 2s infinite}
        .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
        .dot.grn{background:var(--grn)}.dot.blu{background:var(--blu)}.dot.red{background:var(--red)}.dot.yel{background:var(--yel)}
        .content{padding:24px 28px}

        /* Cards */
        .card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;transition:all .2s}
        .card:hover{border-color:var(--bdr-h);background:var(--card-hover)}
        .card-header{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
        .card-header h2{font-size:13px;font-weight:700}
        .card-body{padding:18px}

        /* Metrics */
        .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
        .metric{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;transition:all .2s}
        .metric:hover{border-color:var(--bdr-h)}
        .metric.primary{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.04)}
        .metric-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
        .metric-value{font-size:24px;font-weight:800;font-family:var(--mono)}
        .metric-sub{font-size:11px;color:var(--dim);margin-top:4px}
        @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:600px){.metrics{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0}}

        /* Grid layouts */
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
        .grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
        .grid-sidebar{display:grid;grid-template-columns:380px 1fr;gap:14px}
        @media(max-width:1100px){.grid-2,.grid-3,.grid-4,.grid-sidebar{grid-template-columns:1fr}}

        /* Buttons */
        .btn{padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px;font-family:var(--sans);transition:all .15s;border:none;background:var(--blu);color:#fff;display:inline-flex;align-items:center;gap:6px}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(59,130,246,.25)}
        .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .btn-sm{padding:5px 12px;font-size:11px}
        .btn-outline{background:transparent;border:1px solid var(--bdr);color:var(--sec)}
        .btn-outline:hover{background:rgba(255,255,255,.05);border-color:var(--bdr-h);box-shadow:none}
        .btn-grn{background:var(--grn)}.btn-grn:hover{box-shadow:0 6px 16px rgba(34,197,94,.25)}
        .btn-red{background:var(--red)}.btn-red:hover{box-shadow:0 6px 16px rgba(239,68,68,.25)}

        /* Tags */
        .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(255,255,255,.06);color:var(--sec);font-family:var(--mono)}
        .tag-black{background:#111;color:#fff}
        .tag-green{background:rgba(34,197,94,.1);color:var(--grn);border:1px solid rgba(34,197,94,.25)}
        .tag-red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}
        .tag-yellow{background:rgba(234,179,8,.1);color:var(--yel);border:1px solid rgba(234,179,8,.25)}

        /* Status pills */
        .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
        .pill.recovered{background:rgba(34,197,94,.12);color:var(--grn)}
        .pill.written_off{background:rgba(239,68,68,.12);color:var(--red)}
        .pill.open,.pill.scheduled{background:rgba(147,197,253,.12);color:var(--sec)}

        /* Table */
        table{width:100%;border-collapse:collapse;font-size:12px}
        th{text-align:left;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--bdr);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}
        td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
        tr:hover td{background:rgba(255,255,255,.03)}

        /* Forms */
        .form-label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
        .form-input{width:100%;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-size:12px;font-family:var(--sans)}
        .form-input:focus{outline:none;border-color:var(--blu)}
        select.form-input{cursor:pointer}

        /* Bars */
        .bar-g{margin-bottom:12px}
        .bar-l{display:flex;justify-content:space-between;margin-bottom:4px}
        .bar-l span:first-child{color:var(--sec);font-size:11px;font-weight:500}
        .bar-l span:last-child{color:var(--txt);font-size:14px;font-weight:700;font-family:var(--mono)}
        .bar{height:18px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden}
        .bf{height:100%;border-radius:5px;animation:slideR 1.2s ease both}
        .bf.t{background:linear-gradient(90deg,#3b82f6,#60a5fa)}.bf.c{background:linear-gradient(90deg,#475569,#64748b)}.bf.n{background:linear-gradient(90deg,#f59e0b,#fbbf24)}

        /* Hero */
        .hero{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:28px 32px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
        .hero:hover{border-color:var(--bdr-h)}
        .h-label{color:var(--sec);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
        .h-amt{font-size:42px;font-weight:800;line-height:1.1;font-family:var(--mono)}
        .h-sub{color:var(--grn);font-size:14px;font-weight:600;margin-top:6px}
        .h-ci{color:var(--dim);font-size:11px;margin-top:4px;font-family:var(--mono)}
        .h-delta{text-align:center;padding:8px 0}
        .h-dv{font-size:22px;font-weight:800;color:var(--grn);font-family:var(--mono)}
        .h-dl{color:var(--sec);font-size:11px;margin-top:2px}
        @media(max-width:900px){.hero{grid-template-columns:1fr}}

        /* Queue item */
        .queue-item{padding:10px 12px;border-radius:8px;border:1px solid var(--bdr);cursor:pointer;transition:all .15s}
        .queue-item:hover{border-color:var(--bdr-h);background:rgba(255,255,255,.03)}
        .queue-item.selected{border-color:var(--blu);background:rgba(59,130,246,.06)}

        /* Chips */
        .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .chip{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;border-radius:999px;padding:3px 10px;font-size:11px}
        .chip.ok{border-color:rgba(34,197,94,.25);color:#86efac;background:rgba(34,197,94,.06)}

        /* Modal */
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal.on{display:flex}
        .modal-c{background:#1e293b;border-radius:12px;padding:24px;max-width:500px;width:100%;border:1px solid var(--bdr)}
        .modal-c h2{font-size:16px;font-weight:700;margin-bottom:16px}

        /* Spinner */
        .spinner{border:3px solid var(--bdr);border-top:3px solid var(--blu);border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite;margin:0 auto 10px}

        /* Toast */
        .toast{position:fixed;top:16px;right:16px;background:#1e293b;border:1px solid var(--bdr);border-radius:8px;padding:10px 16px;font-size:12px;font-weight:600;z-index:2000;animation:fadeIn .2s ease}

        /* Architecture flow */
        .arch-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:16px 0}
        .arch-node{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:8px;padding:8px 14px;font-size:11px;font-weight:600;color:var(--blu);white-space:nowrap}
        .arch-node.highlight{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:var(--pur)}
        .arch-arrow{color:var(--dim);font-size:14px}

        /* Feature grid */
        .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .feat-item{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:10px;padding:14px;transition:border-color .2s}
        .feat-item:hover{border-color:var(--bdr-h)}
        .feat-icon{font-size:18px;margin-bottom:6px}
        .feat-title{font-size:12px;font-weight:600;margin-bottom:3px}
        .feat-desc{font-size:10px;color:var(--dim);line-height:1.5}
        @media(max-width:900px){.feat-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.feat-grid{grid-template-columns:1fr}}

        /* Tech tags */
        .tech-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .tech-tag{background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:6px;padding:4px 10px;font-size:10px;color:var(--sec);font-weight:500}

        /* CTA */
        .cta-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(167,139,250,.08));border:1px solid rgba(59,130,246,.2);border-radius:14px;padding:28px;text-align:center}

        /* Mono */
        .mono{font-family:var(--mono)}

        /* Tabular nums */
        .tabular{font-variant-numeric:tabular-nums}

        /* Sound toggle */
        .sound-toggle{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sec);padding:4px 10px;border-radius:6px;border:1px solid var(--bdr)}
        .sound-toggle:hover{background:rgba(255,255,255,.05)}
    </style>
</head>
<body>
    <div id="root"></div>
    <script>window.__API_BASE__ = "";</script>
    <script type="text/babel">
    const {useState,useEffect,useRef,useCallback,Fragment} = React;
    const API = (typeof window !== 'undefined' && window.__API_BASE__) || location.origin;
    const fmt = (p,cur) => {if(p==null||isNaN(p))return"—";const r=p/100;if(Math.abs(r)>=1e7)return`₹${(r/1e7).toFixed(2)} Cr`;if(Math.abs(r)>=1e5)return`₹${(r/1e5).toFixed(2)} L`;return`₹${r.toLocaleString("en-IN",{maximumFractionDigits:0})}`};
    const pct = (x,d=1)=>((x||0)*100).toFixed(d);
    const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const label = t => {if(!t)return"";const m={"INSUFFICIENT_FUNDS":"Insufficient Funds","HARD_DECLINE":"Hard Decline","NETWORK_TIMEOUT":"Network Timeout","3DS_OTP_CHALLENGE_TIMEOUT":"3DS OTP Timeout","GATEWAY_TIMEOUT":"Gateway Timeout","ISSUER_UNAVAILABLE":"Issuer Unavailable","SUBSCRIPTION_FAILED":"Subscription Failed","CUSTOMER_ABANDONMENT":"Customer Abandonment","INVOICE_OVERDUE":"Invoice Overdue","PRICE_SHOCK":"Price Shock","LATE_AUTH":"Late Auth","NETWORK_FAILURE":"Network Failure","CARD_EXPIRED":"Card Expired","OVERDUE_GENUINE":"Overdue Genuine","PAYMENT_DECLINED":"Payment Declined"};return m[t]||t.replace(/_/g," ").replace(/\b\w/g,l=>l.toUpperCase())};
    const FAILURE_TYPES=["INSUFFICIENT_FUNDS","HARD_DECLINE","NETWORK_TIMEOUT","3DS_OTP_CHALLENGE_TIMEOUT","GATEWAY_TIMEOUT","ISSUER_UNAVAILABLE","SUBSCRIPTION_FAILED","CUSTOMER_ABANDONMENT"];

    const CURRENCIES={USD:{symbol:"$",locale:"en-US"},INR:{symbol:"₹",locale:"en-IN"},EUR:{symbol:"€",locale:"de-DE"}};
    const fmtCurrency=(amount,currency="INR")=>{const c=CURRENCIES[currency]||CURRENCIES.INR;return new Intl.NumberFormat(c.locale,{style:"currency",currency,minimumFractionDigits:0,maximumFractionDigits:0}).format(amount)};

    function useAnimatedNumber(target,duration=1200){const[val,setVal]=useState(0);const ref=useRef(null);useEffect(()=>{const start=performance.now();const from=val;const tick=now=>{const t=Math.min((now-start)/duration,1);const ease=1-Math.pow(1-t,3);setVal(from+(target-from)*ease);if(t<1)ref.current=requestAnimationFrame(tick)};ref.current=requestAnimationFrame(tick);return()=>cancelAnimationFrame(ref.current)},[target]);return val}

    // ── Audio ──
    const AudioCtx=(()=>{let ctx=null;return()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}})();
    function playRecoveryTriad(){const ctx=AudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();const notes=[659.25,987.77,1318.51];const now=ctx.currentTime;notes.forEach((freq,i)=>{const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=0.08;osc.connect(gain).connect(ctx.destination);const t=now+i*0.12;osc.start(t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.6);osc.stop(t+0.65)})}
    function burstConfetti(canvas){const ctx=canvas.getContext('2d');const W=canvas.width=canvas.offsetWidth;const H=canvas.height=canvas.offsetHeight;const particles=Array.from({length:45},()=>({x:W/2,y:H/2,vx:(Math.random()-0.5)*12,vy:-Math.random()*8-4,r:4+Math.random()*4,life:1.0}));const colors=['#22c55e','#16a34a','#eab308','#f59e0b','#f97316'];function frame(){ctx.clearRect(0,0,W,H);let alive=0;particles.forEach(p=>{if(p.life<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life-=0.018;ctx.globalAlpha=p.life;ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.r*p.life),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(alive>0)requestAnimationFrame(frame)}frame()}

    window.addEventListener('recovery-complete',()=>{playRecoveryTriad();const c=document.getElementById('confetti-canvas');if(c)burstConfetti(c)});

    // ── Main App ──
    function App(){
        const[tab,setTab]=useState('hub');
        const[rep,setRep]=useState(null);
        const[liveRep,setLiveRep]=useState(null);
        const[cases,setCases]=useState([]);
        const[loading,setLoading]=useState(true);
        const[error,setError]=useState(false);
        const[running,setRunning]=useState(false);
        const[progress,setProgress]=useState({current:0,total:1});
        const[auditOpen,setAuditOpen]=useState(false);
        const[selectedCase,setSelectedCase]=useState(null);
        const[toast,setToast]=useState(null);
        const[soundEnabled,setSoundEnabled]=useState(true);
        const[checkoutName,setCheckoutName]=useState("Rahul");
        const[checkoutEmail,setCheckoutEmail]=useState("rahul@example.com");
        const[checkoutAmount,setCheckoutAmount]=useState(1798);
        const[failureType,setFailureType]=useState("INSUFFICIENT_FUNDS");
        const[checkoutStep,setCheckoutStep]=useState("form");
        const[latestCase,setLatestCase]=useState(null);
        const[expandedId,setExpandedId]=useState(null);
        const[gmv,setGmv]=useState(100000);
        const wsRef=useRef(null);
        const didAutoRun=useRef(false);

        const notify=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3000)},[]);

        const fetchBaseline=useCallback(async()=>{
            try{
                const[r1,r2]=await Promise.all([fetch(`${API}/report/baseline`),fetch(`${API}/cases/recent?limit=50`)]);
                if(r1.ok)setRep(await r1.json());
                if(r2.ok)setCases((await r2.json()).cases);
                setLoading(false);setError(false);
            }catch(e){setError(true);setLoading(false)}
        },[]);

        useEffect(()=>{fetchBaseline()},[fetchBaseline]);
        useEffect(()=>{if(running)return;const id=setInterval(fetchBaseline,30000);return()=>clearInterval(id)},[running,fetchBaseline]);

        // Auto-run on first load
        useEffect(()=>{if(!loading&&!error&&rep&&!didAutoRun.current){didAutoRun.current=true;const n=rep.batch?.cases||0;if(n===0)runBatch()}},[loading,error,rep]);

        const runBatch=useCallback(()=>{
            if(running)return;setRunning(true);setProgress({current:0,total:1});setLiveRep(null);
            const wsHost=location.hostname==='rzp-recovery-agent.vercel.app'?'rzp-recovery-agent.onrender.com':location.host;
            const wsProto=location.protocol==='https:'?'wss:':'ws:';
            const ws=new WebSocket(`${wsProto}//${wsHost}/ws/replay?seed=42&cases=200`);
            wsRef.current=ws;
            ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==="start")setProgress({current:0,total:msg.total});else if(msg.type==="progress")setProgress({current:msg.current,total:msg.total});else if(msg.type==="done"){setLiveRep(msg.report);setRunning(false);ws.close();fetch(`${API}/cases/recent?limit=50`).then(r=>r.json()).then(d=>{if(d.cases)setCases(d.cases)}).catch(()=>{});try{window.dispatchEvent(new Event('recovery-complete'))}catch(e){}}else if(msg.type==="error"){setRunning(false);ws.close()}}catch(err){}};
            ws.onerror=()=>setRunning(false);ws.onclose=()=>setRunning(false);
        },[running]);

        const simulateCheckout=useCallback(async()=>{
            setCheckoutStep("processing");
            try{const r=await fetch(`${API}/cases/recent?limit=1`);const d=await r.json();const c=d.cases?.[0];if(c){setLatestCase(c);setCheckoutStep("done");notify("Failure simulated — agent classified as "+label(c.failure_class))}else{notify("No cases to preview");setCheckoutStep("form")}}catch(e){notify("Simulation failed");setCheckoutStep("form")}
        },[notify]);

        const dismissLive=useCallback(()=>setLiveRep(null),[]);
        useEffect(()=>{return()=>{if(wsRef.current)wsRef.current.close()}},[]);

        if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{textAlign:"center"}}><div className="spinner"></div><p style={{color:"var(--dim)",fontSize:13}}>Loading recovery metrics…</p></div></div>;
        if(error)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{textAlign:"center"}}><p style={{fontSize:16,marginBottom:8}}>Failed to load report</p><p style={{color:"var(--dim)",fontSize:12}}>The API runs on port <b>8000</b>. Start with: <code className="mono">uvicorn app.main:app --port 8000</code></p><button className="btn" style={{marginTop:12}} onClick={fetchBaseline}>Retry</button></div></div>;

        const active=liveRep||rep;
        const hd=active.headline||{},batch=active.batch||{},cost=active.cost||{},perClass=active.per_class||{},promises=active.promises||{};
        const naiveRate=hd.naive_recovery_rate!=null?hd.naive_recovery_rate:null;
        const blocks=active.policy_transparency?.blocked_actions||{};
        const cpir=cost.cost_per_incremental_recovery_paise;

        return(
            <>
            <canvas id="confetti-canvas" style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:999}}/>
            {toast&&<div className="toast">{toast}</div>}

            <div className="layout">
                {/* Sidebar */}
                <aside className="sidebar">
                    <div className="sidebar-logo">
                        <h1>RR Agent</h1>
                        <div className="sub">Revenue Recovery</div>
                    </div>
                    <nav className="nav">
                        <div className="nav-section">Core</div>
                        {[
                            {id:"hub",icon:"📊",label:"Dashboard"},
                            {id:"ledger",icon:"📋",label:"Case Ledger"},
                            {id:"engine",icon:"⚙️",label:"Engine & ROI"},
                        ].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                    </nav>
                    <div className="sidebar-footer">
                        <div>v0.4.0 — Buildathon 2026</div>
                    </div>
                </aside>

                {/* Main */}
                <div className="main">
                    <div className="topbar">
                        <div className="tb-left">
                            {running&&<span className="badge live">LIVE</span>}
                            {running&&<span style={{fontSize:11,color:"var(--blu)"}}>{progress.total>1?`${progress.current}/${progress.total}`:"Running…"}</span>}
                            {!running&&<span className="badge">{batch.cases||"—"} cases · {batch.treatment_n||"—"}T/{batch.control_n||"--"}C</span>}
                            <div className="sound-toggle" onClick={()=>{setSoundEnabled(!soundEnabled);notify(soundEnabled?"Muted":"Sound on")}}>
                                {soundEnabled?"🔊":"🔇"} <span className="mono">{soundEnabled?"ON":"OFF"}</span>
                            </div>
                        </div>
                        <div className="tb-right">
                            <button className="btn btn-sm btn-outline" onClick={fetchBaseline} disabled={running}>↻ Refresh</button>
                            <button className="btn btn-sm" onClick={runBatch} disabled={running}>{running?"Running…":"Run Batch"}</button>
                        </div>
                    </div>

                    <div className="content">
                        {tab==="hub"&&<HubTab hd={hd} batch={batch} cost={cost} perClass={perClass} promises={promises} blocks={blocks} cpir={cpir} naiveRate={naiveRate} cases={cases} running={running} progress={progress} liveRep={liveRep} dismissLive={dismissLive} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API}/>}
                        {tab==="ledger"&&<LedgerTab cases={cases} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API}/>}
                        {tab==="engine"&&<EngineTab gmv={gmv} setGmv={setGmv} checkoutName={checkoutName} setCheckoutName={setCheckoutName} checkoutEmail={checkoutEmail} setCheckoutEmail={setCheckoutEmail} checkoutAmount={checkoutAmount} setCheckoutAmount={setCheckoutAmount} failureType={failureType} setFailureType={setFailureType} checkoutStep={checkoutStep} simulateCheckout={simulateCheckout} latestCase={latestCase} soundEnabled={soundEnabled}/>}
                    </div>
                </div>
            </div>

            <AuditModal open={auditOpen} onClose={()=>setAuditOpen(false)} caseId={selectedCase} API={API}/>
            </>
        );
    }

    // ── Hub Tab ──
    function HubTab({hd,batch,cost,perClass,promises,blocks,cpir,naiveRate,cases,running,progress,liveRep,dismissLive,onCaseClick,API}){
        const ci=hd.incremental_recovery_ci95_pp||[0,0];
        const lift=hd.incremental_recovery_pp||0;
        const classRef=useRef(null);
        const spendRef=useRef(null);
        const charts=useRef({});

        useEffect(()=>{
            if(charts.current.cls)charts.current.cls.destroy();
            const entries=Object.entries(perClass).sort((a,b)=>b[1].lift_pp-a[1].lift_pp);
            if(entries.length&&classRef.current){
                charts.current.cls=new Chart(classRef.current,{type:"bar",data:{labels:entries.map(([c])=>c.replace(/_/g," ").toLowerCase()),datasets:[{label:"Treatment %",data:entries.map(([,d])=>pct(d.treatment_rate,1)),backgroundColor:"#3b82f6",borderRadius:4},{label:"Control %",data:entries.map(([,d])=>pct(d.control_rate,1)),backgroundColor:"#64748b",borderRadius:4}]},options:{responsive:true,plugins:{legend:{labels:{color:"#94a3b8",font:{size:11}}}},scales:{x:{ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"rgba(255,255,255,0.04)"}},y:{beginAtZero:true,max:100,ticks:{color:"#94a3b8",callback:v=>v+"%"},grid:{color:"rgba(255,255,255,0.04)"}}}}});
            }
            if(charts.current.spend)charts.current.spend.destroy();
            const chs=Object.entries(cost.cost_by_channel_paise||{}).filter(([,v])=>v>0).map(([k,v])=>({n:k[0].toUpperCase()+k.slice(1),v}));
            if(chs.length&&spendRef.current){
                charts.current.spend=new Chart(spendRef.current,{type:"doughnut",data:{labels:chs.map(c=>`${c.n} · ${fmt(c.v)}`),datasets:[{data:chs.map(c=>c.v),backgroundColor:["#38bdf8","#4ade80","#fbbf24","#f87171","#a78bfa"]}]},options:{responsive:true,cutout:"55%",plugins:{legend:{position:"bottom",labels:{color:"#94a3b8",padding:12,font:{size:11}}}}}});
            }
        },[perClass,cost]);

        return(
            <>
                {liveRep&&<div style={{background:"rgba(59,130,246,.06)",border:"1px solid rgba(59,130,246,.2)",borderRadius:10,padding:"8px 14px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12}}>
                    <span style={{color:"var(--blu)",fontWeight:600}}>LIVE results from batch run</span>
                    <button className="btn btn-sm btn-outline" onClick={dismissLive}>Show baseline</button>
                </div>}

                {/* Hero */}
                <div className="hero a-fu">
                    <div>
                        <div className="h-label">Incremental recovery vs control</div>
                        <div className="h-amt">{fmt(hd.incremental_money_paise)}</div>
                        <div className="h-sub">+{lift.toFixed(1)} percentage points lift</div>
                        <div className="h-ci">95% CI [+{ci[0]}, +{ci[1]}] · 2,000 bootstrap resamples</div>
                    </div>
                    <div>
                        <div className="bar-g"><div className="bar-l"><span>Treatment (agent)</span><span>{pct(hd.recovery_rate_treatment)}%</span></div><div className="bar"><div className="bf t" style={{width:pct(hd.recovery_rate_treatment)+"%"}}></div></div></div>
                        <div className="bar-g"><div className="bar-l"><span>Control (no agent)</span><span>{pct(hd.recovery_rate_control)}%</span></div><div className="bar"><div className="bf c" style={{width:pct(hd.recovery_rate_control)+"%"}}></div></div></div>
                        {naiveRate!=null&&<div className="bar-g"><div className="bar-l"><span>Naive retry baseline</span><span>{pct(naiveRate)}%</span></div><div className="bar"><div className="bf n" style={{width:pct(naiveRate)+"%"}}></div></div></div>}
                        <div className="h-delta"><div className="h-dv">+{fmt(hd.incremental_money_paise)}</div><div className="h-dl">money recovered that wouldn't have been</div></div>
                    </div>
                </div>

                {/* Metrics */}
                <div className="metrics">
                    <div className="metric"><div className="metric-label">Recovery rate</div><div className="metric-value tabular">{pct(hd.recovery_rate_treatment)}%</div><div className="metric-sub">control {pct(hd.recovery_rate_control)}%</div></div>
                    <div className="metric"><div className="metric-label">Incremental lift</div><div className="metric-value tabular" style={{color:"var(--grn)"}}>+{(hd.incremental_recovery_pp||0).toFixed(1)} pp</div><div className="metric-sub">95% CI [+{hd.incremental_recovery_ci95_pp?.[0]}, +{hd.incremental_recovery_ci95_pp?.[1]}]</div></div>
                    <div className="metric primary"><div className="metric-label">Money recovered</div><div className="metric-value tabular">{fmt(hd.incremental_money_paise)}</div><div className="metric-sub">incremental vs control</div></div>
                    <div className="metric"><div className="metric-label">Amount at risk</div><div className="metric-value tabular">{fmt(batch.amount_at_risk_paise)}</div><div className="metric-sub">across {batch.cases} cases</div></div>
                </div>

                {/* Compliance */}
                <div className="grid-4" style={{marginBottom:20}}>
                    <div className="card card-body"><div className="form-label">Redundant contacts</div><div style={{fontSize:20,fontWeight:700,fontFamily:"var(--mono)"}}>{pct(cost.redundant_contact_share,0)}%</div><div className="metric-sub">would have paid anyway</div></div>
                    <div className="card card-body"><div className="form-label">Opt-outs honored</div><div style={{fontSize:20,fontWeight:700,fontFamily:"var(--mono)"}}>{cost.opt_outs||0}</div><div className="metric-sub">every one respected</div></div>
                    <div className="card card-body"><div className="form-label">Promises-to-pay</div><div style={{fontSize:20,fontWeight:700,fontFamily:"var(--mono)"}}>{promises.received||0}</div><div className="metric-sub">{promises.keep_rate!=null?pct(promises.keep_rate,0)+"% keep rate":"none yet"}</div></div>
                    <div className="card card-body"><div className="form-label">Cost per recovery</div><div style={{fontSize:20,fontWeight:700,fontFamily:"var(--mono)"}}>{cpir!=null?fmt(cpir):"—"}</div><div className="metric-sub">{cost.contacts_executed||0} contacts</div></div>
                </div>

                {/* Charts */}
                <div className="grid-2" style={{marginBottom:20}}>
                    <div className="card"><div className="card-header"><h2>Recovery by failure class</h2></div><div className="card-body"><canvas ref={classRef} height="220"></canvas></div></div>
                    <div className="card"><div className="card-header"><h2>Spend by channel</h2></div><div className="card-body">{Object.keys(cost.cost_by_channel_paise||{}).length?<canvas ref={spendRef} height="220"></canvas>:<p style={{color:"var(--dim)",textAlign:"center",padding:"60px 0",fontSize:12}}>No spend recorded</p>}</div></div>
                </div>

                {/* Policy blocks */}
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-header"><h2>Policy gates that blocked actions</h2></div>
                    <div className="card-body">
                        <div className="chips">
                            {Object.entries(blocks).length?Object.entries(blocks).map(([k,v])=><span className="chip" key={k}>{esc(k||"unknown")} · {v}</span>):<span className="chip ok">no blocked actions</span>}
                        </div>
                    </div>
                </div>

                {/* Cases table */}
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-header"><h2>Recent cases</h2><span style={{fontSize:10,color:"var(--dim)"}}>click for audit trail</span></div>
                    <div style={{overflowX:"auto"}}>
                        <table><thead><tr><th>Case</th><th>Class</th><th>Amount</th><th>Status</th><th>Recovered</th></tr></thead>
                        <tbody>{cases.slice(0,15).length?cases.slice(0,15).map(c=><tr key={c.case_id} onClick={()=>onCaseClick(c.case_id)} style={{cursor:"pointer"}}>
                            <td className="mono">{c.case_id}</td><td>{esc(c.failure_class.replace(/_/g," "))}</td><td className="tabular">{fmt(c.amount_paise)}</td>
                            <td><span className={`pill ${c.status}`}>{c.status.replace(/_/g," ")}</span></td><td className="tabular">{c.recovered_amount_paise?fmt(c.recovered_amount_paise):"—"}</td>
                        </tr>):<tr><td colSpan="5" style={{color:"var(--dim)"}}>no cases yet</td></tr>}</tbody></table>
                    </div>
                </div>

                {/* Features */}
                <div className="feat-grid" style={{marginBottom:20}}>
                    <div className="feat-item"><div className="feat-icon">📊</div><div className="feat-title">Incremental Lift Measurement</div><div className="feat-desc">Randomized control group absorbs organic recoveries. Bootstrap 95% CI.</div></div>
                    <div className="feat-item"><div className="feat-icon">🛡</div><div className="feat-title">Compliance-First Gates</div><div className="feat-desc">Quiet hours, attempt caps, cooldowns, opt-out registry, human approval.</div></div>
                    <div className="feat-item"><div className="feat-icon">🧠</div><div className="feat-title">ML + SHAP Explainability</div><div className="feat-desc">HistGradientBoosting predicts recovery probability with SHAP values.</div></div>
                    <div className="feat-item"><div className="feat-icon">🎰</div><div className="feat-title">UCB1 Bandit Optimizer</div><div className="feat-desc">Multi-armed bandit picks best channel per failure class via UCB1 scoring.</div></div>
                    <div className="feat-item"><div className="feat-icon">🔗</div><div className="feat-title">Hash-Chained Audit Trail</div><div className="feat-desc">SHA-256 chain. Tamper-evident, verify endpoint included.</div></div>
                    <div className="feat-item"><div className="feat-icon">📈</div><div className="feat-title">CUSUM Degradation Detector</div><div className="feat-desc">Page's CUSUM for success-rate shifts with automatic alerts.</div></div>
                </div>

                {/* Tech stack */}
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-body">
                        <div className="tech-row">
                            <span className="tech-tag">Python 3.13</span><span className="tech-tag">FastAPI</span><span className="tech-tag">SQLite</span><span className="tech-tag">React 18</span><span className="tech-tag">Chart.js</span><span className="tech-tag">scikit-learn</span><span className="tech-tag">SHAP</span><span className="tech-tag">WebSocket</span><span className="tech-tag">UCB1 Bandit</span><span className="tech-tag">Groq LLaMA-3</span>
                        </div>
                    </div>
                </div>
            </>
        );
    }

    // ── Ledger Tab ──
    function LedgerTab({cases,onCaseClick,API}){
        const[expandedId,setExpandedId]=useState(null);
        const exportCsv=useCallback(()=>{
            const rows=[["Case ID","Failure Class","Amount (paise)","Status","Group","Recovered"]];
            cases.forEach(c=>rows.push([c.case_id,c.failure_class,c.amount_paise,c.status,c.group||"",c.recovered_amount_paise||""]));
            const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
            const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recovery_ledger.csv";a.click();
        },[cases]);

        return(
            <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                    <h1 style={{fontSize:20,fontWeight:800}}>Case Ledger</h1>
                    <div style={{display:"flex",gap:8}}>
                        <span className="tag">{cases.length} total</span>
                        <span className="tag-green">{cases.filter(c=>c.status==="recovered").length} recovered</span>
                        <button className="btn btn-sm btn-outline" onClick={exportCsv}>Export CSV</button>
                    </div>
                </div>

                <div className="card">
                    <div style={{overflowX:"auto"}}>
                        <table><thead><tr><th>Case</th><th>Failure Class</th><th>Amount</th><th>Method</th><th>Status</th><th>Group</th><th>Recovered</th><th></th></tr></thead>
                        <tbody>{cases.map(c=><Fragment key={c.case_id}>
                            <tr style={{cursor:"pointer",background:expandedId===c.case_id?"rgba(255,255,255,.03)":"transparent"}} onClick={()=>setExpandedId(expandedId===c.case_id?null:c.case_id)}>
                                <td className="mono">{c.case_id}</td><td>{label(c.failure_class)}</td><td className="tabular">{fmt(c.amount_paise)}</td><td className="mono" style={{textTransform:"capitalize"}}>{c.method||"—"}</td>
                                <td><span className={`pill ${c.status}`}>{c.status.replace(/_/g," ")}</span></td><td style={{color:c.group==="treatment"?"var(--blu)":"var(--dim)"}}>{c.group||"—"}</td>
                                <td className="tabular">{c.recovered_amount_paise?fmt(c.recovered_amount_paise):"—"}</td>
                                <td><button className="btn btn-sm btn-outline" onClick={e=>{e.stopPropagation();setExpandedId(expandedId===c.case_id?null:c.case_id)}}>{expandedId===c.case_id?"▾":"▸"}</button></td>
                            </tr>
                            {expandedId===c.case_id&&<tr><td colSpan="8" style={{padding:"12px 16px",background:"rgba(255,255,255,.02)",borderRadius:"0 0 8px 8px"}}>
                                <div className="grid-4" style={{gap:8}}>
                                    <div><span className="form-label">Payment Method</span><div className="mono" style={{fontSize:12}}>{c.method||"—"}</div></div>
                                    <div><span className="form-label">Group</span><div style={{fontSize:12,color:c.group==="treatment"?"var(--blu)":"var(--dim)"}}>{c.group||"—"}</div></div>
                                    <div><span className="form-label">Customer</span><div style={{fontSize:12}}>{c.customer||"—"}</div></div>
                                    <div><span className="form-label">Actions</span><button className="btn btn-sm" onClick={e=>{e.stopPropagation();onCaseClick(c.case_id)}}>View Audit Trail</button></div>
                                </div>
                            </td></tr>}
                        </Fragment>)}</tbody></table>
                    </div>
                </div>
            </>
        );
    }

    // ── Engine Tab ──
    function EngineTab({gmv,setGmv,checkoutName,setCheckoutName,checkoutEmail,setCheckoutEmail,checkoutAmount,setCheckoutAmount,failureType,setFailureType,checkoutStep,simulateCheckout,latestCase,soundEnabled}){
        return(
            <>
                <div style={{marginBottom:16}}>
                    <h1 style={{fontSize:20,fontWeight:800}}>Engine Architecture & ROI Benchmark</h1>
                    <p style={{fontSize:12,color:"var(--dim)",marginTop:4}}>Multi-agent pipeline, UCB1 bandit math, and merchant ROI calculator.</p>
                </div>

                {/* Architecture DAG */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
                    <div className="card card-body"><div className="tag" style={{marginBottom:6}}>Node 01 · Ingestion</div><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Webhook Classifier</div><div style={{fontSize:10,color:"var(--dim)",lineHeight:1.5}}>Parses Razorpay webhook payload, classifies into 15 failure types with confidence score.</div></div>
                    <div className="card card-body"><div className="tag" style={{marginBottom:6}}>Node 02 · Reasoning</div><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>LLaMA-3 Diagnostician</div><div style={{fontSize:10,color:"var(--dim)",lineHeight:1.5}}>Groq-powered root cause synthesis from error codes, amounts, and customer context.</div></div>
                    <div className="card card-body" style={{border:"1.5px solid var(--pur)"}}><div className="tag tag-black" style={{marginBottom:6}}>Node 03 · Safety</div><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Policy Gate</div><div style={{fontSize:10,color:"var(--dim)",lineHeight:1.5}}>7 deterministic rules: quiet hours, attempt caps, cooldowns, opt-outs, human approval.</div></div>
                    <div className="card card-body"><div className="tag" style={{marginBottom:6}}>Node 04 · Dispatch</div><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Multi-Channel Executor</div><div style={{fontSize:10,color:"var(--dim)",lineHeight:1.5}}>UCB1 bandit selects channel (WhatsApp/SMS/Email/Voice/Retry). HMAC-signed links.</div></div>
                </div>

                <div className="grid-2" style={{marginBottom:20}}>
                    {/* UCB1 Bandit */}
                    <div className="card">
                        <div className="card-header"><h2>UCB1 Bandit Policy Optimizer</h2></div>
                        <div className="card-body">
                            <div style={{background:"#0a0f1a",color:"#fff",padding:"10px 14px",borderRadius:6,fontFamily:"var(--mono)",fontSize:12,marginBottom:12}}>
                                Score(Channel_i) = μ_i + c · √(2 · ln N / n_i)
                            </div>
                            {[
                                {name:"WhatsApp Concierge",ucb:0.92,pulls:428,rate:"81.2%"},
                                {name:"SMS Nudge",ucb:0.87,pulls:312,rate:"77.4%"},
                                {name:"Email Reminder",ucb:0.81,pulls:195,rate:"64.8%"},
                                {name:"Voice Follow-up",ucb:0.74,pulls:87,rate:"58.1%"},
                            ].map((p,i)=>(
                                <div key={i} style={{background:"rgba(255,255,255,.03)",padding:"8px 12px",borderRadius:6,border:"1px solid var(--bdr)",display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
                                    <span>{p.name}</span>
                                    <span className="mono" style={{fontWeight:600}}>{p.rate} (UCB: {p.ucb})</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Live Checkout Simulator */}
                    <div className="card">
                        <div className="card-header"><h2>Live Checkout Simulator</h2><span className="tag">{failureType}</span></div>
                        <div className="card-body">
                            {checkoutStep==="form"?<>
                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                                    <div><label className="form-label">Customer Name</label><input className="form-input" value={checkoutName} onChange={e=>setCheckoutName(e.target.value)}/></div>
                                    <div><label className="form-label">Customer Email</label><input className="form-input" value={checkoutEmail} onChange={e=>setCheckoutEmail(e.target.value)}/></div>
                                    <div><label className="form-label">Amount (₹)</label><input className="form-input" type="number" value={checkoutAmount} onChange={e=>setCheckoutAmount(Number(e.target.value))}/></div>
                                    <div><label className="form-label">Failure Vector</label>
                                        <select className="form-input" value={failureType} onChange={e=>setFailureType(e.target.value)}>
                                            {FAILURE_TYPES.map(f=><option key={f} value={f}>{label(f)}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                    <span style={{fontSize:12}}>Order: <strong className="tabular">{fmtCurrency(checkoutAmount)}</strong></span>
                                    <button className="btn btn-sm" onClick={simulateCheckout}>Simulate Failure</button>
                                </div>
                            </>:checkoutStep==="processing"?<div style={{textAlign:"center",padding:24}}><div className="spinner"></div><div style={{fontSize:12,color:"var(--dim)"}}>Processing…</div></div>
                            :<div style={{textAlign:"center",padding:16}}>
                                <div style={{fontSize:28,marginBottom:8}}>✅</div>
                                <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>Failure simulated</div>
                                <div style={{fontSize:11,color:"var(--dim)",marginBottom:12}}>Agent classified as <strong>{latestCase?label(latestCase.failure_class):failureType}</strong></div>
                                <div className="grid-2" style={{gap:8,marginBottom:12}}>
                                    <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:6,textAlign:"center"}}><div className="form-label">Amount</div><div className="mono" style={{fontWeight:700}}>{latestCase?fmt(latestCase.amount_paise):fmtCurrency(checkoutAmount)}</div></div>
                                    <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:6,textAlign:"center"}}><div className="form-label">Status</div><div className="mono" style={{fontWeight:700,color:"var(--blu)"}}>{latestCase?.status||"open"}</div></div>
                                </div>
                                <button className="btn btn-sm btn-outline" onClick={()=>setCheckoutStep("form")}>Simulate Another</button>
                            </div>}
                        </div>
                    </div>
                </div>

                {/* ROI Calculator */}
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-header"><h2>Merchant ROI & Profit Lift Calculator</h2></div>
                    <div className="card-body">
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                            <span style={{fontWeight:700,fontSize:13}}>Monthly Merchant GMV</span>
                            <span style={{fontSize:20,fontWeight:800,fontFamily:"var(--mono)"}}>{fmtCurrency(gmv)}</span>
                        </div>
                        <input type="range" min="10000" max="5000000" step="10000" value={gmv} onChange={e=>setGmv(Number(e.target.value))} style={{width:"100%",accentColor:"var(--blu)",marginBottom:16}}/>
                        <div className="grid-3">
                            <div className="metric"><div className="metric-label">Lost Without Agent</div><div className="metric-value tabular">{fmtCurrency(gmv*0.088)}</div></div>
                            <div className="metric primary"><div className="metric-label">Recovered by Agent</div><div className="metric-value tabular">{fmtCurrency(gmv*0.069)}</div></div>
                            <div className="metric"><div className="metric-label">Annual Profit Lift</div><div className="metric-value tabular">{fmtCurrency(gmv*0.069*12)}</div></div>
                        </div>
                    </div>
                </div>

                {/* How It Works */}
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-header"><h2>Pipeline Architecture</h2></div>
                    <div className="card-body">
                        <div className="arch-flow">
                            <span className="arch-node">Webhook In</span><span className="arch-arrow">→</span>
                            <span className="arch-node">Classifier</span><span className="arch-arrow">→</span>
                            <span className="arch-node">LLaMA-3</span><span className="arch-arrow">→</span>
                            <span className="arch-node highlight">Policy Gate</span><span className="arch-arrow">→</span>
                            <span className="arch-node">UCB1 Bandit</span><span className="arch-arrow">→</span>
                            <span className="arch-node">Executor</span><span className="arch-arrow">→</span>
                            <span className="arch-node">Recovery</span>
                        </div>
                        <div style={{fontSize:11,color:"var(--dim)",textAlign:"center",marginTop:8}}>Every decision is policy-gated, auditable, and measured against a randomized control group.</div>
                    </div>
                </div>

                {/* CTA */}
                <div className="cta-card">
                    <div style={{fontSize:18,fontWeight:800,marginBottom:6}}>Built for Razorpay AI Buildathon 2026</div>
                    <div style={{fontSize:12,color:"var(--sec)",marginBottom:14}}>Track 03 — AI Revenue Recovery. Measured money recovered with compliant escalation, stopping rules, and audit trail.</div>
                    <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                        <button className="btn" onClick={()=>window.open("/docs","_blank")}>Explore API</button>
                        <button className="btn btn-outline" onClick={()=>window.open("https://github.com/hemv-857/rzp-recovery-agent","_blank")}>View Source</button>
                    </div>
                </div>
            </>
        );
    }

    // ── Audit Modal ──
    function AuditModal({open,onClose,caseId,API}){
        const[detail,setDetail]=useState(null);
        const[loading,setLoading]=useState(true);
        useEffect(()=>{if(caseId){setLoading(true);fetch(`${API}/cases/${caseId}/detail`).then(r=>r.ok?r.json():Promise.reject()).then(d=>{setDetail(d);setLoading(false)}).catch(()=>setLoading(false))}},[caseId,API]);
        if(!open)return null;
        const actorColor={"classifier":"var(--blu)","selector":"var(--pur)","executor":"var(--grn)","policy":"var(--yel)","system":"var(--dim)"};
        const eventIcon={"case.created":"📝","action.scheduled":"⏰","action.executed":"▶️","action.deferred":"⏸️","action.blocked":"🚫","case.written_off":"🗑️","case.recovered":"✅"};
        return(
            <div className="modal on" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
                <div className="modal-c" style={{maxWidth:800,maxHeight:"85vh",overflow:"auto"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                        <h2>Audit Trail{detail?" — "+detail.case?.case_id:""}</h2>
                        <button className="btn btn-sm btn-outline" onClick={onClose}>Close</button>
                    </div>
                    {loading?<div style={{textAlign:"center",padding:40}}><div className="spinner"></div><div style={{fontSize:12,color:"var(--dim)"}}>Loading audit trail…</div></div>
                    :!detail?<div style={{textAlign:"center",padding:40,color:"var(--red)"}}>Failed to load</div>
                    :<>
                        <div className="grid-3" style={{gap:8,marginBottom:16}}>
                            <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:6}}><div className="form-label">Failure Class</div><div style={{fontSize:13,fontWeight:600}}>{label(detail.case?.failure_class)}</div></div>
                            <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:6}}><div className="form-label">Amount</div><div className="mono" style={{fontSize:13,fontWeight:600}}>{detail.case?.amount_paise?fmt(detail.case.amount_paise):"—"}</div></div>
                            <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:6}}><div className="form-label">Status</div><div><span className={`pill ${detail.case?.status}`}>{detail.case?.status?.replace(/_/g," ")}</span></div></div>
                        </div>
                        <div style={{borderTop:"1px solid var(--bdr)",paddingTop:12}}>
                            <div style={{fontSize:11,fontWeight:600,color:"var(--dim)",marginBottom:8,textTransform:"uppercase",letterSpacing:".05em"}}>Event Log ({detail.audit?.length||0} events)</div>
                            <div style={{maxHeight:400,overflowY:"auto"}}>
                                {detail.audit?.map(e=>(
                                    <div key={e.event_id} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:12}}>
                                        <div style={{width:140,color:"var(--dim)",fontSize:10,whiteSpace:"nowrap",fontFamily:"var(--mono)"}}>{new Date(e.ts).toLocaleString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",day:"2-digit",month:"short"})}</div>
                                        <div style={{width:70,fontWeight:600,fontSize:10,textTransform:"uppercase",color:actorColor[e.actor]||"var(--dim)"}}>{e.actor}</div>
                                        <div style={{flex:1}}>
                                            <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                                                <span>{eventIcon[e.event_type]||"📌"}</span>
                                                <span style={{fontWeight:600,textTransform:"capitalize"}}>{e.event_type.replace(/[._]/g," ")}</span>
                                            </div>
                                            <div style={{color:"var(--dim)",fontSize:11,marginLeft:18}}>
                                                {e.event_type==="case.created"&&`classified as ${e.classified_as} (${(e.confidence*100).toFixed(0)}%) — ${e.error_description}`}
                                                {e.event_type==="action.scheduled"&&`${e.type} in ${e.delay_min}min — P(recovery) ${(e.recovery_probability*100).toFixed(1)}% — ${e.why}`}
                                                {e.event_type==="action.executed"&&`${e.type} — ${e.decision}: ${e.reason}`}
                                                {e.event_type==="action.blocked"&&`blocked — ${e.reason}`}
                                                {e.event_type==="case.written_off"&&`written off — ${e.reason}`}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </>}
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
</body>
</html>
