<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Recovery Agent — Dashboard</title>
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root{--bg:#0a0f1a;--card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07);--bdr:rgba(255,255,255,.08);--bdr-h:rgba(255,255,255,.15);--txt:#f1f5f9;--sec:#94a3b8;--dim:#64748b;--grn:#22c55e;--blu:#3b82f6;--pur:#a78bfa;--red:#ef4444;--yel:#eab308;--cyn:#06b6d4}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
        @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideR{from{width:0}}
        @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.08)}50%{box-shadow:0 0 40px rgba(59,130,246,.18)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
        .a-fu{animation:fadeUp .5s ease both}.a-fi{animation:fadeIn .4s ease both}.a-sc{animation:scaleIn .4s ease both}
        .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
        .topbar{background:rgba(10,15,26,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .tb-brand{display:flex;align-items:center;gap:12px}
        .tb-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--blu),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
        .tb-title{font-size:16px;font-weight:700}.tb-sub{font-size:11px;color:var(--dim)}
        .tb-acts{display:flex;gap:10px;align-items:center}
        .badge{font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid rgba(34,197,94,.4);color:var(--grn);text-transform:uppercase;font-weight:600}
        .ctr{max-width:1400px;margin:0 auto;padding:28px 32px}
        .hero{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:32px 36px;margin-bottom:24px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;transition:border-color .3s}
        .hero:hover{border-color:var(--bdr-h)}
        .h-label{color:var(--sec);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
        .h-amt{font-size:48px;font-weight:800;line-height:1.1}
        .h-sub{color:var(--grn);font-size:15px;font-weight:600;margin-top:8px}
        .h-ci{color:var(--dim);font-size:12px;margin-top:4px}
        .bar-g{margin-bottom:14px}
        .bar-l{display:flex;justify-content:space-between;margin-bottom:5px}
        .bar-l span:first-child{color:var(--sec);font-size:12px;font-weight:500}
        .bar-l span:last-child{color:var(--txt);font-size:18px;font-weight:700}
        .bar{height:22px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
        .bf{height:100%;border-radius:6px;animation:slideR 1.2s ease both}
        .bf.t{background:linear-gradient(90deg,#3b82f6,#60a5fa)}.bf.c{background:linear-gradient(90deg,#475569,#64748b)}.bf.n{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
        .h-delta{text-align:center;padding:10px 0}
        .h-dv{font-size:26px;font-weight:800;color:var(--grn)}
        .h-dl{color:var(--sec);font-size:12px;margin-top:2px}
        .grid{display:grid;gap:20px;margin-bottom:20px}
        .m4{grid-template-columns:repeat(4,1fr)}.m3{grid-template-columns:repeat(3,1fr)}.m2{grid-template-columns:repeat(2,1fr)}
        @media(max-width:1024px){.m4{grid-template-columns:repeat(2,1fr)}.m3{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}
        @media(max-width:600px){.m4{grid-template-columns:1fr}.m3{grid-template-columns:1fr}.m2{grid-template-columns:1fr}.ctr{padding:16px}}
        .card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:22px;transition:all .25s ease}
        .card:hover{border-color:var(--bdr-h);background:var(--card-hover)}
        .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .card-t{font-size:14px;font-weight:600}
        .card-b{font-size:10px;color:var(--dim);padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.05)}
        .ml{color:var(--sec);font-size:11px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
        .mv{font-size:28px;font-weight:700;margin-bottom:4px}
        .ms{font-size:12px;color:var(--grn)}.ms.m{color:var(--dim)}
        .cg{grid-template-columns:repeat(4,1fr)}
        .cc .lb{color:var(--sec);font-size:11px;font-weight:500;margin-bottom:6px;text-transform:uppercase}
        .cc .vl{font-size:22px;font-weight:700}.cc .nt{font-size:11px;color:var(--dim);margin-top:6px}
        .cc.hon{border-left:3px solid var(--yel)}
        .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
        .chip{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;border-radius:999px;padding:4px 12px;font-size:12px}
        .chip.ok{border-color:rgba(34,197,94,.25);color:#86efac;background:rgba(34,197,94,.06)}
        .chips .cap{font-size:11px;color:var(--dim);margin-left:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;color:var(--sec);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--bdr);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
        td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
        tr:hover td{background:rgba(255,255,255,.03)}
        .pos{color:var(--grn)}.neg{color:var(--red)}
        a.cl{color:#7dd3fc;text-decoration:none;font-family:ui-monospace,monospace;font-size:12px}
        a.cl:hover{text-decoration:underline}
        .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
        .pill.recovered{background:rgba(34,197,94,.12);color:var(--grn)}
        .pill.written_off{background:rgba(239,68,68,.12);color:var(--red)}
        .pill.open,.pill.scheduled{background:rgba(147,197,253,.12);color:var(--sec)}
        .btns{display:flex;gap:10px;flex-wrap:wrap}
        button{padding:10px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:13px;font-family:inherit}
        .bp{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
        .bp:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,130,246,.3)}
        .bs{background:rgba(255,255,255,.06);color:var(--sec);border:1px solid var(--bdr)}
        .bs:hover{background:rgba(255,255,255,.1)}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal.on{display:flex}
        .modal-c{background:#1e293b;border-radius:12px;padding:28px;max-width:460px;width:100%;border:1px solid var(--bdr)}
        .modal-c h2{font-size:18px;font-weight:700;margin-bottom:20px}
        .fg{margin-bottom:14px}
        .fg label{color:var(--sec);font-size:12px;font-weight:500;display:block;margin-bottom:5px}
        .fg input{width:100%;padding:10px 12px;background:#334155;border:1px solid #475569;border-radius:6px;color:var(--txt);font-size:14px}
        .fg input:focus{outline:none;border-color:var(--blu)}
        .mb{display:flex;gap:10px;margin-top:18px}.mb button{flex:1;padding:10px}
        .ftr{text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--bdr);padding-top:20px;margin-top:28px}
        .ftr a{color:var(--blu);text-decoration:none}
        .spinner{border:3px solid var(--bdr);border-top:3px solid var(--blu);border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;margin:0 auto 12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .ld,.err{display:flex;align-items:center;justify-content:center;min-height:400px;background:var(--card);border-radius:12px;border:1px solid var(--bdr)}
        .err{color:var(--red)}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    const {useState,useEffect,useRef,useCallback} = React;
    const API = location.origin;
    const fmt = p => {if(p==null||isNaN(p))return"—";const r=p/100;if(Math.abs(r)>=1e7)return`₹${(r/1e7).toFixed(2)} Cr`;if(Math.abs(r)>=1e5)return`₹${(r/1e5).toFixed(2)} L`;return`₹${r.toLocaleString("en-IN",{maximumFractionDigits:0})}`};
    const pct = (x,d=1)=>((x||0)*100).toFixed(d);
    const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    function useAnimatedNumber(target, duration=1200) {
        const [val, setVal] = useState(0);
        const ref = useRef(null);
        useEffect(() => {
            const start = performance.now();
            const from = val;
            const tick = now => {
                const t = Math.min((now - start) / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);
                setVal(from + (target - from) * ease);
                if (t < 1) ref.current = requestAnimationFrame(tick);
            };
            ref.current = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(ref.current);
        }, [target]);
        return val;
    }

    function TopBar({cases, treatment, control, onRefresh, onRunBatch, running, progress}) {
        return (
            <div className="topbar">
                <div className="tb-brand">
                    <div className="tb-logo">R</div>
                    <div><div className="tb-title">Revenue Recovery Agent</div><div className="tb-sub">Razorpay AI Buildathon 2026 — Track 03</div></div>
                </div>
                <div className="tb-acts">
                    {running && <span style={{fontSize:11,color:"var(--blu)",marginRight:8}}>
                        {progress.current}/{progress.total} cases
                    </span>}
                    {running && <div style={{width:80,height:4,background:"rgba(255,255,255,.1)",borderRadius:2,overflow:"hidden",marginRight:8}}>
                        <div style={{height:"100%",width:(progress.current/progress.total*100)+"%",background:"var(--blu)",borderRadius:2,transition:"width .2s"}}></div>
                    </div>}
                    <button className="bs" onClick={onRefresh} style={{padding:"6px 12px",fontSize:11}} disabled={running}>↻ Refresh</button>
                    <button className="bp" onClick={onRunBatch} style={{padding:"6px 14px",fontSize:11}} disabled={running}>{running?"Running…":"Run Batch"}</button>
                    <span className="badge">{cases} cases · {treatment}T/{control}C</span>
                </div>
            </div>
        );
    }

    function Hero({hd, naiveRate}) {
        const ci = hd.incremental_recovery_ci95_pp || [0,0];
        const lift = hd.incremental_recovery_pp || 0;
        return (
            <div className="hero a-fu">
                <div>
                    <div className="h-label">Incremental recovery vs control</div>
                    <div className="h-amt">{fmt(hd.incremental_money_paise)}</div>
                    <div className="h-sub">+{lift.toFixed(1)} percentage points lift</div>
                    <div className="h-ci">95% CI [+{ci[0]}, +{ci[1]}] · 2,000 bootstrap resamples</div>
                </div>
                <div>
                    <div className="bar-g">
                        <div className="bar-l"><span>Treatment (agent)</span><span>{pct(hd.recovery_rate_treatment)}%</span></div>
                        <div className="bar"><div className="bf t" style={{width:pct(hd.recovery_rate_treatment)+"%"}}></div></div>
                    </div>
                    <div className="bar-g">
                        <div className="bar-l"><span>Control (no agent)</span><span>{pct(hd.recovery_rate_control)}%</span></div>
                        <div className="bar"><div className="bf c" style={{width:pct(hd.recovery_rate_control)+"%"}}></div></div>
                    </div>
                    {naiveRate != null && <div className="bar-g">
                        <div className="bar-l"><span>Naive retry baseline</span><span>{pct(naiveRate)}%</span></div>
                        <div className="bar"><div className="bf n" style={{width:pct(naiveRate)+"%"}}></div></div>
                    </div>}
                    <div className="h-delta">
                        <div className="h-dv">+{fmt(hd.incremental_money_paise)}</div>
                        <div className="h-dl">money recovered that wouldn't have been</div>
                    </div>
                </div>
            </div>
        );
    }

    function MetricCard({label, value, sub, color, delay}) {
        return (
            <div className={`card a-fu d${delay}`}>
                <div className="ml">{label}</div>
                <div className="mv" style={color?{color}:{}}>{value}</div>
                <div className={`ms${sub?.muted?" m":""}`}>{sub?.text||sub||""}</div>
            </div>
        );
    }

    function ComplianceCard({label, value, note, honest, delay}) {
        return (
            <div className={`card cc${honest?" hon":""} a-fu d${delay}`}>
                <div className="lb">{label}</div>
                <div className="vl">{value}</div>
                <div className="nt">{note}</div>
            </div>
        );
    }

    function Charts({perClass, spendByChannel}) {
        const classRef = useRef(null);
        const spendRef = useRef(null);
        const charts = useRef({});
        useEffect(() => {
            if(charts.current.cls) charts.current.cls.destroy();
            const entries = Object.entries(perClass).sort((a,b)=>b[1].lift_pp-a[1].lift_pp);
            charts.current.cls = new Chart(classRef.current, {
                type:"bar",
                data:{labels:entries.map(([c])=>c.replace(/_/g," ").toLowerCase()),datasets:[
                    {label:"Treatment %",data:entries.map(([,d])=>pct(d.treatment_rate,1)),backgroundColor:"#3b82f6",borderRadius:4},
                    {label:"Control %",data:entries.map(([,d])=>pct(d.control_rate,1)),backgroundColor:"#64748b",borderRadius:4}
                ]},
                options:{responsive:true,plugins:{legend:{labels:{color:"#94a3b8",font:{size:11}}}},scales:{
                    x:{ticks:{color:"#94a3b8",font:{size:10}},grid:{color:"rgba(255,255,255,.04)"}},
                    y:{beginAtZero:true,max:100,ticks:{color:"#94a3b8",callback:v=>v+"%"},grid:{color:"rgba(255,255,255,.04)"}}
                }}
            });
            if(charts.current.spend) charts.current.spend.destroy();
            const chs = Object.entries(spendByChannel).filter(([,v])=>v>0).map(([k,v])=>({n:k[0].toUpperCase()+k.slice(1),v}));
            if(chs.length && spendRef.current) {
                charts.current.spend = new Chart(spendRef.current, {
                    type:"doughnut",
                    data:{labels:chs.map(c=>`${c.n} · ${fmt(c.v)}`),datasets:[{data:chs.map(c=>c.v),backgroundColor:["#38bdf8","#4ade80","#fbbf24","#f87171","#a78bfa"]}]},
                    options:{responsive:true,cutout:"55%",plugins:{legend:{position:"bottom",labels:{color:"#94a3b8",padding:12,font:{size:11}}}}}
                });
            }
        }, [perClass, spendByChannel]);
        return (
            <div className="grid m2">
                <div className="card a-fu d5"><div className="card-h"><span className="card-t">Recovery by failure class</span></div><canvas ref={classRef} height="220"></canvas></div>
                <div className="card a-fu d6"><div className="card-h"><span className="card-t">Spend by channel</span></div>{Object.keys(spendByChannel).length?<canvas ref={spendRef} height="220"></canvas>:<p style={{color:"var(--dim)",textAlign:"center",padding:"60px 0"}}>No spend recorded</p>}</div>
            </div>
        );
    }

    function CasesTable({cases}) {
        return (
            <div className="card a-fu" style={{marginBottom:20}}>
                <div className="card-h"><span className="card-t">Recent cases</span><span className="card-b">click for audit trail</span></div>
                <table><thead><tr><th>Case</th><th>Class</th><th>Amount</th><th>Status</th><th>Recovered</th></tr></thead>
                <tbody>{cases.length?cases.map(c=><tr key={c.case_id}>
                    <td><a className="cl" href={`/audit/${c.case_id}`} target="_blank">{c.case_id}</a></td>
                    <td>{esc(c.failure_class.replace(/_/g," "))}</td><td>{fmt(c.amount_paise)}</td>
                    <td><span className={`pill ${c.status}`}>{c.status.replace(/_/g," ")}</span>{c.written_off_reason?` — ${c.written_off_reason.replace(/_/g," ")}`:""}</td>
                    <td>{c.recovered_amount_paise?fmt(c.recovered_amount_paise):"—"}</td>
                </tr>):<tr><td colSpan="5" style={{color:"var(--dim)"}}>no cases yet</td></tr>}</tbody></table>
            </div>
        );
    }

    function ROIModal({open, onClose}) {
        const [phase, setPhase] = useState("form");
        const [result, setResult] = useState(null);
        const [amt, setAmt] = useState(10);
        const [base, setBase] = useState(20);
        const [lift, setLift] = useState(50);
        const calc = async () => {
            try {
                const q = new URLSearchParams({amount_at_risk_cr:amt,baseline_recovery_pct:base,estimated_lift_pp:lift});
                const r = await fetch(`${API}/calculator?${q}`);
                if(!r.ok) throw 0;
                setResult(await r.json());
                setPhase("result");
            } catch(e) { alert("Calculation failed"); }
        };
        if(!open) return null;
        return (
            <div className="modal on" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
                <div className="modal-c">
                    <h2>ROI Calculator</h2>
                    {phase==="form"?<>
                        <div className="fg"><label>Amount at risk (₹ Cr)</label><input type="number" value={amt} onChange={e=>setAmt(e.target.value)} step="0.1" min="0.1"/></div>
                        <div className="fg"><label>Baseline recovery %</label><input type="number" value={base} onChange={e=>setBase(e.target.value)} min="0" max="100"/></div>
                        <div className="fg"><label>Estimated lift (pp)</label><input type="number" value={lift} onChange={e=>setLift(e.target.value)} min="0" max="100"/></div>
                        <div className="mb"><button className="bp" onClick={calc}>Calculate</button><button className="bs" onClick={onClose}>Close</button></div>
                    </>:<>
                        <div style={{textAlign:"center",padding:"12px 0"}}>
                            <div style={{color:"var(--sec)",fontSize:11,textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>Incremental Recovery</div>
                            <div style={{fontSize:34,fontWeight:800,color:"var(--grn)",marginBottom:4}}>{result.incremental_recovery_display}</div>
                            <div style={{color:"var(--dim)",fontSize:12,marginBottom:16}}>money recovered that wouldn't have been</div>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                            {[["PROJECTED CONTACTS",result.projected_contacts.toLocaleString("en-IN")],["CONTACT SPEND",fmt(result.projected_contact_spend_paise)],["COST / RECOVERY",fmt(result.cost_per_incremental_recovery_paise)],["ROI MULTIPLE",result.projected_contact_spend_paise>0?(result.incremental_recovery_paise/result.projected_contact_spend_paise).toFixed(0)+"x":"—"]].map(([l,v],i)=><div key={i} style={{background:"rgba(255,255,255,.04)",padding:12,borderRadius:8,textAlign:"center"}}><div style={{color:"var(--sec)",fontSize:10,textTransform:"uppercase",marginBottom:3}}>{l}</div><div style={{fontSize:17,fontWeight:700}}>{v}</div></div>)}
                        </div>
                        <div style={{color:"var(--dim)",fontSize:11,borderTop:"1px solid var(--bdr)",paddingTop:10}}>assumptions: median case {result.assumptions.median_case_amount} · {result.assumptions.cost_per_touch_source}</div>
                        <div className="mb" style={{marginTop:12}}><button className="bs" onClick={()=>setPhase("form")}>Recalculate</button><button className="bs" onClick={onClose}>Close</button></div>
                    </>}
                </div>
            </div>
        );
    }

    function App() {
        const [rep, setRep] = useState(null);
        const [cases, setCases] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(false);
        const [roiOpen, setRoiOpen] = useState(false);
        const [security, setSecurity] = useState(null);
        const [budget, setBudget] = useState(null);
        const [bandit, setBandit] = useState(null);
        const [cusum, setCusum] = useState(null);
        const [incidents, setIncidents] = useState(null);
        const [approval, setApproval] = useState(null);
        const [running, setRunning] = useState(false);
        const [progress, setProgress] = useState({current:0,total:1});
        const wsRef = useRef(null);

        const fetchAll = useCallback(async () => {
            try {
                const [r1,r2,r3,r4,r5,r6,r7,r8] = await Promise.all([
                    fetch(`${API}/report`),
                    fetch(`${API}/cases/recent?limit=15`),
                    fetch(`${API}/security/report`),
                    fetch(`${API}/budget`),
                    fetch(`${API}/analytics/bandit`),
                    fetch(`${API}/analytics/cusum`),
                    fetch(`${API}/incidents`),
                    fetch(`${API}/approval/queue`),
                ]);
                if(r1.ok) setRep(await r1.json());
                if(r2.ok) setCases((await r2.json()).cases);
                if(r3.ok) setSecurity(await r3.json());
                if(r4.ok) setBudget(await r4.json());
                if(r5.ok) setBandit(await r5.json());
                if(r6.ok) setCusum(await r6.json());
                if(r7.ok) setIncidents(await r7.json());
                if(r8.ok) setApproval(await r8.json());
                setLoading(false);
                setError(false);
            } catch(e) { setError(true); setLoading(false); }
        }, []);

        useEffect(() => { fetchAll(); }, [fetchAll]);

        // Auto-refresh every 15s when not running a batch
        useEffect(() => {
            if(running) return;
            const id = setInterval(fetchAll, 15000);
            return () => clearInterval(id);
        }, [running, fetchAll]);

        const runBatch = useCallback(() => {
            if(running) return;
            setRunning(true);
            setProgress({current:0,total:1});
            const ws = new WebSocket(`ws://${location.host}/ws/replay?seed=42&cases=200`);
            wsRef.current = ws;
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if(msg.type === "start") setProgress({current:0,total:msg.total});
                    else if(msg.type === "progress") setProgress({current:msg.current,total:msg.total});
                    else if(msg.type === "done") {
                        setRunning(false);
                        ws.close();
                        fetchAll();
                    } else if(msg.type === "error") {
                        setRunning(false);
                        ws.close();
                    }
                } catch(err) {}
            };
            ws.onerror = () => { setRunning(false); };
            ws.onclose = () => { setRunning(false); };
        }, [running, fetchAll]);

        // Cleanup WebSocket on unmount
        useEffect(() => { return () => { if(wsRef.current) wsRef.current.close(); }; }, []);

        if(loading) return <div className="ld"><div style={{textAlign:"center"}}><div className="spinner"></div><p style={{color:"var(--dim)"}}>Loading recovery metrics…</p></div></div>;
        if(error) return <div className="err"><div style={{textAlign:"center"}}><p style={{fontSize:18,marginBottom:8}}>Failed to load report</p><p style={{color:"var(--dim)"}}>Is the API running at {esc(API)}?</p><button className="bp" onClick={fetchAll} style={{marginTop:12}}>Retry</button></div></div>;

        const hd=rep.headline||{},batch=rep.batch||{},cost=rep.cost||{},perClass=rep.per_class||{},promises=rep.promises||{};
        const naiveRate=hd.naive_recovery_rate!=null?hd.naive_recovery_rate:null;
        const blocks=rep.policy_transparency?.blocked_actions||{};
        const cpir=cost.cost_per_incremental_recovery_paise;

        return (<>
            <TopBar cases={batch.cases} treatment={batch.treatment_n} control={batch.control_n} onRefresh={fetchAll} onRunBatch={runBatch} running={running} progress={progress}/>
            <div className="ctr">
                <Hero hd={hd} naiveRate={naiveRate}/>
                <div className="grid m4">
                    <MetricCard label="Recovery rate" value={pct(hd.recovery_rate_treatment)+"%"} sub={{text:`control ${pct(hd.recovery_rate_control)}%`,muted:true}} delay={1}/>
                    <MetricCard label="Incremental lift" value={`+${(hd.incremental_recovery_pp||0).toFixed(1)} pp`} sub={`95% CI [+${hd.incremental_recovery_ci95_pp?.[0]}, +${hd.incremental_recovery_ci95_pp?.[1]}]`} color="var(--grn)" delay={2}/>
                    <MetricCard label="Money recovered" value={fmt(hd.incremental_money_paise)} sub={{text:"incremental vs control",muted:true}} delay={3}/>
                    <MetricCard label="Amount at risk" value={fmt(batch.amount_at_risk_paise)} sub={{text:`across ${batch.cases} cases`,muted:true}} delay={4}/>
                </div>
                <div className="grid cg">
                    <ComplianceCard label="Redundant contacts" value={pct(cost.redundant_contact_share,0)+"%"} note="would have paid anyway — reported, not hidden" honest delay={1}/>
                    <ComplianceCard label="Opt-outs honored" value={cost.opt_outs||0} note="every one respected globally" delay={2}/>
                    <ComplianceCard label="Promises-to-pay" value={promises.received||0} note={`${promises.keep_rate!=null?pct(promises.keep_rate,0)+"% keep rate":"none yet"}${promises.money_via_promises_paise?" · "+fmt(promises.money_via_promises_paise):""}`} delay={3}/>
                    <ComplianceCard label="Cost per recovery" value={cpir!=null?fmt(cpir):"—"} note={`${cost.contacts_executed||0} contacts · ${fmt(cost.spend_paise)} spend`} delay={4}/>
                </div>
                <Charts perClass={perClass} spendByChannel={cost.cost_by_channel_paise||{}}/>
                <div className="card" style={{marginBottom:20}}>
                    <div className="card-h"><span className="card-t">Policy gates that blocked actions</span></div>
                    <div className="chips">
                        {Object.entries(blocks).length?Object.entries(blocks).map(([k,v])=><span className="chip" key={k}>{esc(k||"unknown")} · {v}</span>):<span className="chip ok">no blocked actions</span>}
                        <span className="cap">every block is audit-logged</span>
                    </div>
                </div>
                <CasesTable cases={cases}/>

                {/* ── Security Panel ── */}
                {security && <div className="card a-fu" style={{marginBottom:20}}>
                    <div className="card-h"><span className="card-t">🛡 Security Posture</span><span className="badge" style={{borderColor:security.overall_status==="PASS"?"rgba(34,197,94,.4)":"rgba(234,179,8,.4)",color:security.overall_status==="PASS"?"var(--grn)":"var(--yel)"}}>{security.overall_status}</span></div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:14}}>
                        <div style={{background:"rgba(255,255,255,.04)",padding:14,borderRadius:10,textAlign:"center"}}>
                            <div style={{color:"var(--sec)",fontSize:10,textTransform:"uppercase",letterSpacing:".05em"}}>Threats Mitigated</div>
                            <div style={{fontSize:22,fontWeight:800,color:"var(--grn)",marginTop:4}}>{security.threat_model?.mitigated}/{security.threat_model?.total}</div>
                        </div>
                        <div style={{background:"rgba(255,255,255,.04)",padding:14,borderRadius:10,textAlign:"center"}}>
                            <div style={{color:"var(--sec)",fontSize:10,textTransform:"uppercase",letterSpacing:".05em"}}>Adversarial Test</div>
                            <div style={{fontSize:22,fontWeight:800,color:security.adversarial_test?.pass?"var(--grn)":"var(--red)",marginTop:4}}>{security.adversarial_test?.pass?"PASS":"FAIL"}</div>
                        </div>
                        <div style={{background:"rgba(255,255,255,.04)",padding:14,borderRadius:10,textAlign:"center"}}>
                            <div style={{color:"var(--sec)",fontSize:10,textTransform:"uppercase",letterSpacing:".05em"}}>Audit Chain</div>
                            <div style={{fontSize:22,fontWeight:800,color:security.audit_chain?.valid?"var(--grn)":"var(--red)",marginTop:4}}>{security.audit_chain?.valid?"VALID":"BROKEN"}</div>
                            <div style={{color:"var(--dim)",fontSize:10}}>{security.audit_chain?.total_links} links</div>
                        </div>
                    </div>
                    {security.adversarial_test && <div style={{background:"rgba(34,197,94,.06)",border:"1px solid rgba(34,197,94,.15)",borderRadius:8,padding:"10px 14px",fontSize:12,color:"var(--grn)"}}>
                        ✅ {security.adversarial_test.cases_tested} adversarial cases tested · {security.adversarial_test.cases_terminated} terminated by policy · 0 compliance violations
                    </div>}
                </div>}

                {/* ── Budget + Bandit + CUSUM Row ── */}
                <div className="grid m3" style={{marginBottom:20}}>
                    {budget && <div className="card a-fu d1">
                        <div className="card-h"><span className="card-t">📊 Intervention Budget</span></div>
                        <div style={{padding:"8px 0"}}>
                            <div className="bar-g"><div className="bar-l"><span>Used</span><span>{budget.total-budget.remaining}/{budget.total}</span></div>
                            <div className="bar"><div className="bf t" style={{width:(budget.utilization*100)+"%"}}></div></div></div>
                            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:10}}>
                                {Object.entries(budget.by_channel||{}).slice(0,6).map(([ch,v])=><div key={ch} style={{background:"rgba(255,255,255,.04)",padding:6,borderRadius:6,textAlign:"center"}}><div style={{color:"var(--dim)",fontSize:9,textTransform:"uppercase"}}>{ch}</div><div style={{fontSize:13,fontWeight:700}}>{v}</div></div>)}
                            </div>
                        </div>
                    </div>}
                    {bandit && <div className="card a-fu d2">
                        <div className="card-h"><span className="card-t">🎰 Channel Bandit</span></div>
                        <div style={{padding:"8px 0"}}>
                            {Object.entries(bandit).map(([ch,v])=><div key={ch} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                                <span style={{fontSize:12,color:"var(--sec)",textTransform:"capitalize"}}>{ch}</span>
                                <div style={{display:"flex",gap:12,alignItems:"center"}}>
                                    <span style={{fontSize:11,color:"var(--dim)"}}>{v.pulls} pulls</span>
                                    <div style={{width:60,height:6,background:"rgba(255,255,255,.06)",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:(v.mean_recovery*100)+"%",background:"var(--blu)",borderRadius:3}}></div></div>
                                    <span style={{fontSize:12,fontWeight:600,width:40,textAlign:"right"}}>{(v.mean_recovery*100).toFixed(0)}%</span>
                                </div>
                            </div>)}
                        </div>
                    </div>}
                    {cusum && <div className="card a-fu d3">
                        <div className="card-h"><span className="card-t">📈 CUSUM Detector</span></div>
                        <div style={{padding:"8px 0"}}>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                                <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:8,textAlign:"center"}}>
                                    <div style={{color:"var(--dim)",fontSize:9,textTransform:"uppercase"}}>Positive</div>
                                    <div style={{fontSize:18,fontWeight:700}}>{cusum.positive_cusum}</div>
                                </div>
                                <div style={{background:"rgba(255,255,255,.04)",padding:10,borderRadius:8,textAlign:"center"}}>
                                    <div style={{color:"var(--dim)",fontSize:9,textTransform:"uppercase"}}>Negative</div>
                                    <div style={{fontSize:18,fontWeight:700}}>{cusum.negative_cusum}</div>
                                </div>
                            </div>
                            <div style={{marginTop:8,fontSize:11,color:"var(--dim)",textAlign:"center"}}>baseline: {(cusum.baseline*100).toFixed(0)}% · threshold: {cusum.threshold} · {cusum.observations} observations</div>
                        </div>
                    </div>}
                </div>

                {/* ── Incidents + Approval Queue Row ── */}
                <div className="grid m2" style={{marginBottom:20}}>
                    {incidents && <div className="card a-fu d1">
                        <div className="card-h"><span className="card-t">🔥 Incident Log</span><span className="badge" style={{borderColor:"rgba(34,197,94,.4)",color:"var(--grn)"}}>{incidents.resolved}/{incidents.total} resolved</span></div>
                        <div style={{maxHeight:200,overflowY:"auto"}}>
                            {(incidents.incidents||[]).slice(0,5).map(inc=><div key={inc.id} style={{padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:12}}>
                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                    <span style={{fontWeight:600}}>{inc.id}: {inc.title}</span>
                                    <span style={{color:inc.severity==="high"?"var(--red)":inc.severity==="medium"?"var(--yel)":"var(--dim)",fontSize:10,textTransform:"uppercase"}}>{inc.severity}</span>
                                </div>
                                <div style={{color:"var(--dim)",fontSize:11,marginTop:2}}>{inc.fix}</div>
                            </div>)}
                        </div>
                    </div>}
                    {approval && <div className="card a-fu d2">
                        <div className="card-h"><span className="card-t">✋ Approval Queue</span><span className="badge" style={{borderColor:approval.count>0?"rgba(234,179,8,.4)":"rgba(34,197,94,.4)",color:approval.count>0?"var(--yel)":"var(--grn)"}}>{approval.count} pending</span></div>
                        <div style={{padding:"8px 0"}}>
                            {approval.count===0?<div style={{color:"var(--dim)",fontSize:12,textAlign:"center",padding:16}}>No cases pending approval</div>
                            :(approval.queue||[]).slice(0,5).map(c=><div key={c.case_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:12}}>
                                <div><span style={{fontWeight:600}}>{c.customer}</span><span style={{color:"var(--dim)",marginLeft:8}}>{c.failure_class}</span></div>
                                <span style={{fontWeight:700}}>{fmt(c.amount_paise)}</span>
                            </div>)}
                            <div style={{color:"var(--dim)",fontSize:10,marginTop:8,textAlign:"center"}}>threshold: {fmt(approval.threshold_paise)}</div>
                        </div>
                    </div>}
                </div>

                <div className="btns" style={{marginBottom:20}}>
                    <button className="bp" onClick={()=>setRoiOpen(true)}>ROI Calculator</button>
                    <button className="bs" onClick={()=>window.open("/docs","_blank")}>API Documentation</button>
                </div>
                <div className="ftr">
                    <p>Razorpay Revenue Recovery Agent v0.3.0 — every number is computed from the append-only audit trail</p>
                    <p style={{marginTop:6}}>Treatment/control stratified by failure class at ingest · 5-seed evaluation · Bootstrap 95% CI · <a href="/docs">API docs</a></p>
                </div>
            </div>
            <ROIModal open={roiOpen} onClose={()=>setRoiOpen(false)}/>
        </>);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
</body>
</html>
