<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Recovery Agent — Dashboard</title>
    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0f1a;--card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07);--bdr:rgba(255,255,255,.08);--bdr-h:rgba(255,255,255,.15);--txt:#f1f5f9;--sec:#94a3b8;--dim:#64748b;--grn:#22c55e;--blu:#3b82f6;--pur:#a78bfa;--red:#ef4444;--yel:#eab308;--cyn:#06b6d4;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
        @keyframes slideR{from{width:0}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
        @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        .a-fu{animation:fadeUp .45s ease both}.a-fi{animation:fadeIn .35s ease both}.a-sc{animation:scaleIn .35s ease both}.a-si{animation:slideIn .35s ease both}
        .d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}.d5{animation-delay:.2s}.d6{animation-delay:.24s}

        /* Layout */
        .layout{display:flex;min-height:100vh}
        .sidebar{width:210px;background:rgba(255,255,255,.02);border-right:1px solid var(--bdr);padding:18px 0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:50}
        .sidebar-logo{padding:0 18px 16px;border-bottom:1px solid var(--bdr);margin-bottom:12px}
        .sidebar-logo h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
        .sidebar-logo .sub{font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
        .nav{padding:0 10px;flex:1}
        .nav-section{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px;font-weight:700}
        .nav-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--sec);transition:all .15s;display:flex;align-items:center;gap:9px;margin-bottom:1px;user-select:none}
        .nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
        .nav-item.active{background:rgba(59,130,246,.12);color:var(--blu);font-weight:600}
        .nav-item .icon{font-size:14px;width:18px;text-align:center}
        .sidebar-footer{padding:12px 18px;border-top:1px solid var(--bdr);font-size:9px;color:var(--dim)}
        .main{flex:1;margin-left:210px}
        .topbar{background:rgba(10,15,26,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .tb-left{display:flex;align-items:center;gap:12px}
        .tb-right{display:flex;align-items:center;gap:8px}
        .badge{font-size:8px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid rgba(34,197,94,.4);color:var(--grn);text-transform:uppercase;font-weight:700}
        .badge.warn{border-color:rgba(234,179,8,.4);color:var(--yel)}
        .badge.live{border-color:rgba(59,130,246,.4);color:var(--blu);animation:pulse 2s infinite}
        .badge.pur{border-color:rgba(167,139,250,.4);color:var(--pur)}
        .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
        .dot.grn{background:var(--grn)}.dot.blu{background:var(--blu)}.dot.red{background:var(--red)}.dot.yel{background:var(--yel)}
        .content{padding:22px 24px}

        /* Cards — hover lift */
        .card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;transition:all .2s cubic-bezier(.4,0,.2,1)}
        .card:hover{border-color:var(--bdr-h);background:var(--card-hover)}
        .card-header{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
        .card-header h2{font-size:12px;font-weight:700}
        .card-body{padding:16px}

        /* Metrics — hover lift */
        .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
        .metric{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:14px 16px;transition:all .22s cubic-bezier(.4,0,.2,1)}
        .metric:hover{border-color:var(--bdr-h);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
        .metric.primary{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.04)}
        .metric-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:5px}
        .metric-value{font-size:22px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .metric-sub{font-size:10px;color:var(--dim);margin-top:3px}
        @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:600px){.metrics{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0}}

        /* Grid layouts */
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
        .grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
        .grid-sidebar{display:grid;grid-template-columns:360px 1fr;gap:12px}
        @media(max-width:1100px){.grid-2,.grid-3,.grid-4,.grid-sidebar{grid-template-columns:1fr}}
        @media(max-width:768px){.grid-4{grid-template-columns:1fr 1fr}}

        /* Buttons — lift on hover */
        .btn{padding:7px 14px;border-radius:7px;font-weight:600;cursor:pointer;font-size:11px;font-family:var(--sans);transition:all .15s cubic-bezier(.4,0,.2,1);border:none;background:var(--blu);color:#fff;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
        .btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.25)}
        .btn:active{transform:translateY(0)}
        .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
        .btn-sm{padding:4px 10px;font-size:10px}
        .btn-xs{padding:3px 8px;font-size:9px;border-radius:5px}
        .btn-outline{background:transparent;border:1px solid var(--bdr);color:var(--sec)}
        .btn-outline:hover{background:rgba(255,255,255,.05);border-color:var(--bdr-h);box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .btn-grn{background:var(--grn)}.btn-grn:hover{box-shadow:0 4px 12px rgba(34,197,94,.25)}
        .btn-red{background:var(--red)}.btn-red:hover{box-shadow:0 4px 12px rgba(239,68,68,.25)}
        .btn-yel{background:var(--yel);color:#000}.btn-yel:hover{box-shadow:0 4px 12px rgba(234,179,8,.25)}
        .btn-pur{background:var(--pur)}.btn-pur:hover{box-shadow:0 4px 12px rgba(167,139,250,.25)}

        /* Tags */
        .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:700;background:rgba(255,255,255,.06);color:var(--sec);font-family:var(--mono)}
        .tag-black{background:#111;color:#fff}
        .tag-green{background:rgba(34,197,94,.1);color:var(--grn);border:1px solid rgba(34,197,94,.2)}
        .tag-red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
        .tag-yellow{background:rgba(234,179,8,.1);color:var(--yel);border:1px solid rgba(234,179,8,.2)}
        .tag-blue{background:rgba(59,130,246,.1);color:var(--blu);border:1px solid rgba(59,130,246,.2)}

        /* Status pills */
        .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
        .pill.recovered{background:rgba(34,197,94,.12);color:var(--grn)}
        .pill.written_off{background:rgba(239,68,68,.12);color:var(--red)}
        .pill.open,.pill.scheduled{background:rgba(147,197,253,.12);color:var(--sec)}

        /* Table */
        table{width:100%;border-collapse:collapse;font-size:11px}
        th{text-align:left;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bdr);font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}
        td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
        tr:hover td{background:rgba(255,255,255,.03)}
        tr{transition:background .1s}

        /* Forms */
        .form-label{display:block;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:3px}
        .form-input{width:100%;padding:7px 9px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-size:11px;font-family:var(--sans);transition:border-color .15s}
        .form-input:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
        select.form-input{cursor:pointer}
        textarea.form-input{resize:vertical;min-height:60px;font-family:var(--mono);font-size:10px}

        /* Bars */
        .bar-g{margin-bottom:10px}
        .bar-l{display:flex;justify-content:space-between;margin-bottom:3px}
        .bar-l span:first-child{color:var(--sec);font-size:10px;font-weight:500}
        .bar-l span:last-child{color:var(--txt);font-size:13px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .bar{height:16px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
        .bf{height:100%;border-radius:4px;animation:slideR 1s ease both}
        .bf.t{background:linear-gradient(90deg,#3b82f6,#60a5fa)}.bf.c{background:linear-gradient(90deg,#475569,#64748b)}.bf.n{background:linear-gradient(90deg,#f59e0b,#fbbf24)}

        /* Hero */
        .hero{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:24px 28px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;transition:all .2s}
        .hero:hover{border-color:var(--bdr-h)}
        .h-label{color:var(--sec);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
        .h-amt{font-size:38px;font-weight:800;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .h-sub{color:var(--grn);font-size:13px;font-weight:600;margin-top:5px}
        .h-ci{color:var(--dim);font-size:10px;margin-top:3px;font-family:var(--mono)}
        .h-delta{text-align:center;padding:6px 0}
        .h-dv{font-size:20px;font-weight:800;color:var(--grn);font-family:var(--mono);font-variant-numeric:tabular-nums}
        .h-dl{color:var(--sec);font-size:10px;margin-top:2px}
        @media(max-width:900px){.hero{grid-template-columns:1fr}}

        /* Queue item */
        .queue-item{padding:9px 11px;border-radius:7px;border:1px solid var(--bdr);cursor:pointer;transition:all .15s}
        .queue-item:hover{border-color:var(--bdr-h);background:rgba(255,255,255,.03)}
        .queue-item.selected{border-color:var(--blu);background:rgba(59,130,246,.06)}

        /* Chips */
        .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
        .chip{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;border-radius:999px;padding:2px 8px;font-size:10px}
        .chip.ok{border-color:rgba(34,197,94,.25);color:#86efac;background:rgba(34,197,94,.06)}

        /* Modal — fade+scale in */
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
        .modal.on{display:flex}
        .modal-c{background:#1e293b;border-radius:12px;padding:22px;max-width:500px;width:100%;border:1px solid var(--bdr);animation:modalIn .25s ease;box-shadow:0 24px 48px rgba(0,0,0,.3)}
        .modal-c h2{font-size:15px;font-weight:700;margin-bottom:14px}

        /* Toast — slide in */
        .toast{position:fixed;top:14px;right:14px;background:#1e293b;border:1px solid var(--bdr);border-radius:8px;padding:9px 14px;font-size:11px;font-weight:600;z-index:2000;animation:toastIn .25s ease;box-shadow:0 4px 12px rgba(0,0,0,.2)}

        /* Skeleton shimmer */
        .skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
        .sk-line{height:14px;margin-bottom:8px}
        .sk-card{height:80px;border-radius:10px;margin-bottom:12px}

        /* Architecture flow */
        .arch-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 0}
        .arch-node{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:7px;padding:7px 12px;font-size:10px;font-weight:600;color:var(--blu);white-space:nowrap;transition:all .15s}
        .arch-node:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.15)}
        .arch-node.highlight{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:var(--pur)}
        .arch-arrow{color:var(--dim);font-size:12px}

        /* Stepper */
        .stepper{display:flex;gap:0;margin:12px 0}
        .step{flex:1;text-align:center;padding:8px 4px;font-size:9px;font-weight:600;color:var(--dim);border-bottom:2px solid var(--bdr);transition:all .3s}
        .step.active{color:var(--blu);border-bottom-color:var(--blu)}
        .step.done{color:var(--grn);border-bottom-color:var(--grn)}
        .step-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bdr);display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-bottom:4px;transition:all .3s}
        .step.active .step-dot{border-color:var(--blu);background:rgba(59,130,246,.15);color:var(--blu)}
        .step.done .step-dot{border-color:var(--grn);background:rgba(34,197,94,.15);color:var(--grn)}

        /* Funnel */
        .funnel{display:flex;align-items:center;gap:4px;margin:12px 0}
        .funnel-stage{flex:1;text-align:center;padding:10px 6px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;transition:all .2s}
        .funnel-stage:hover{border-color:var(--bdr-h)}
        .funnel-num{font-size:18px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
        .funnel-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
        .funnel-arrow{color:var(--dim);font-size:11px;flex-shrink:0}

        /* Feature grid */
        .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .feat-item{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;padding:12px;transition:all .2s}
        .feat-item:hover{border-color:var(--bdr-h);transform:translateY(-1px)}
        .feat-icon{font-size:16px;margin-bottom:5px}
        .feat-title{font-size:11px;font-weight:600;margin-bottom:2px}
        .feat-desc{font-size:9px;color:var(--dim);line-height:1.5}
        @media(max-width:900px){.feat-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.feat-grid{grid-template-columns:1fr}}

        /* Tech tags */
        .tech-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .tech-tag{background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:5px;padding:3px 8px;font-size:9px;color:var(--sec);font-weight:500}

        /* CTA */
        .cta-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(167,139,250,.08));border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:24px;text-align:center}

        /* Mono + tabular */
        .mono{font-family:var(--mono)}.tabular{font-variant-numeric:tabular-nums}

        /* Sound toggle */
        .sound-toggle{cursor:pointer;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sec);padding:3px 8px;border-radius:5px;border:1px solid var(--bdr);transition:all .15s}
        .sound-toggle:hover{background:rgba(255,255,255,.05)}

        /* Search */
        .search-input{padding:6px 10px 6px 28px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-size:11px;font-family:var(--sans);width:180px;transition:all .2s}
        .search-input:focus{outline:none;border-color:var(--blu);width:220px}
        .search-wrap{position:relative}
        .search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none}

        /* Approval row */
        .approval-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
        .approval-row:last-child{border-bottom:none}

        /* Security grid */
        .sec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .sec-box{background:rgba(255,255,255,.04);padding:10px;border-radius:7px;text-align:center}
        .sec-label{color:var(--dim);font-size:8px;text-transform:uppercase;letter-spacing:.05em}
        .sec-val{font-size:18px;font-weight:800;margin-top:3px;font-family:var(--mono)}

        /* WhatsApp preview bubble */
        .wa-bubble{background:#111b21;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;font-size:12px;line-height:1.6;color:#e9edef;max-width:340px;margin:0 auto}
        .wa-header{color:#00a884;font-weight:600;margin-bottom:8px;font-size:13px}
        .wa-footer{color:#667781;font-size:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;margin-top:10px}
        .wa-btn{display:inline-block;padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;margin-top:10px;margin-right:6px}
        .wa-btn.primary{background:rgba(0,168,132,.15);color:#00a884;border:1px solid rgba(0,168,132,.3)}
        .wa-btn.secondary{background:rgba(255,255,255,.06);color:#8696a0;border:1px solid rgba(255,255,255,.1)}
    </style>
</head>
<body>
    <div id="root"></div>
    <script>window.__API_BASE__ = "";</script>
    <script type="text/babel">
    const {useState,useEffect,useRef,useCallback,Fragment} = React;
    const API = (typeof window !== 'undefined' && window.__API_BASE__) || location.origin;
    const fmt = p => {if(p==null||isNaN(p))return"—";const r=p/100;if(Math.abs(r)>=1e7)return`₹${(r/1e7).toFixed(2)} Cr`;if(Math.abs(r)>=1e5)return`₹${(r/1e5).toFixed(2)} L`;return`₹${r.toLocaleString("en-IN",{maximumFractionDigits:0})}`};
    const pct = (x,d=1)=>((x||0)*100).toFixed(d);
    const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const label = t => {if(!t)return"";const m={"INSUFFICIENT_FUNDS":"Insufficient Funds","HARD_DECLINE":"Hard Decline","NETWORK_TIMEOUT":"Network Timeout","3DS_OTP_CHALLENGE_TIMEOUT":"3DS OTP Timeout","GATEWAY_TIMEOUT":"Gateway Timeout","ISSUER_UNAVAILABLE":"Issuer Unavailable","SUBSCRIPTION_FAILED":"Subscription Failed","CUSTOMER_ABANDONMENT":"Customer Abandonment","INVOICE_OVERDUE":"Invoice Overdue","PRICE_SHOCK":"Price Shock","LATE_AUTH":"Late Auth","NETWORK_FAILURE":"Network Failure","CARD_EXPIRED":"Card Expired","OVERDUE_GENUINE":"Overdue Genuine","PAYMENT_DECLINED":"Payment Declined"};return m[t]||t.replace(/_/g," ").replace(/\b\w/g,l=>l.toUpperCase())};
    const FAILURE_TYPES=["INSUFFICIENT_FUNDS","HARD_DECLINE","NETWORK_TIMEOUT","3DS_OTP_CHALLENGE_TIMEOUT","GATEWAY_TIMEOUT","ISSUER_UNAVAILABLE","SUBSCRIPTION_FAILED","CUSTOMER_ABANDONMENT"];

    // ── Audio ──
    const AudioCtx=(()=>{let ctx=null;return()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}})();
    function playTriad(){const ctx=AudioCtx();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();[659.25,987.77,1318.51].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.07;o.connect(g).connect(ctx.destination);const t=ctx.currentTime+i*0.12;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);o.stop(t+0.6)})}
    function burstConfetti(cvs){const ctx=cvs.getContext('2d');const W=cvs.width=cvs.offsetWidth;const H=cvs.height=cvs.offsetHeight;const ps=Array.from({length:50},()=>({x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*9-3,r:3+Math.random()*5,life:1}));const cols=['#22c55e','#16a34a','#eab308','#f59e0b','#f97316','#3b82f6','#a78bfa'];(function f(){ctx.clearRect(0,0,W,H);let a=0;ps.forEach(p=>{if(p.life<=0)return;a++;p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=.016;ctx.globalAlpha=p.life;ctx.fillStyle=cols[~~(Math.random()*cols.length)];ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r*p.life),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(a>0)requestAnimationFrame(f)})()}
    window.addEventListener('recovery-complete',()=>{playTriad();const c=document.getElementById('confetti-canvas');if(c)burstConfetti(c)});

    // ── Keyboard shortcut ──
    // handled in App via useEffect

    // ── Main App ──
    function App(){
        const[tab,setTab]=useState('hub');
        const[rep,setRep]=useState(null);
        const[liveRep,setLiveRep]=useState(null);
        const[cases,setCases]=useState([]);
        const[loading,setLoading]=useState(true);
        const[error,setError]=useState(false);
        const[running,setRunning]=useState(false);
        const[progress,setProgress]=useState({current:0,total:1});
        const[auditOpen,setAuditOpen]=useState(false);
        const[selectedCase,setSelectedCase]=useState(null);
        const[toast,setToast]=useState(null);
        const[soundEnabled,setSoundEnabled]=useState(true);
        const[autoPilot,setAutoPilot]=useState(false);
        const[lastUpdated,setLastUpdated]=useState(null);
        const[security,setSecurity]=useState(null);
        const[budget,setBudget]=useState(null);
        const[bandit,setBandit]=useState(null);
        const[cusum,setCusum]=useState(null);
        const[incidents,setIncidents]=useState(null);
        const[approval,setApproval]=useState(null);
        const[funnel,setFunnel]=useState(null);
        const wsRef=useRef(null);
        const didAutoRun=useRef(false);
        const autoPilotRef=useRef(false);
        autoPilotRef.current=autoPilot;

        const notify=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3000)},[]);

        const fetchBaseline=useCallback(async()=>{
            try{
                const[r1,r2,r3,r4,r5,r6,r7,r8,r9]=await Promise.all([
                    fetch(`${API}/report/baseline`),fetch(`${API}/cases/recent?limit=50`),
                    fetch(`${API}/security/report`),fetch(`${API}/budget`),
                    fetch(`${API}/analytics/bandit`),fetch(`${API}/analytics/cusum`),
                    fetch(`${API}/incidents`),fetch(`${API}/approval/queue`),
                    fetch(`${API}/analytics/funnel`),
                ]);
                if(r1.ok)setRep(await r1.json());
                if(r2.ok)setCases((await r2.json()).cases);
                if(r3.ok)setSecurity(await r3.json());
                if(r4.ok)setBudget(await r4.json());
                if(r5.ok)setBandit(await r5.json());
                if(r6.ok)setCusum(await r6.json());
                if(r7.ok)setIncidents(await r7.json());
                if(r8.ok)setApproval(await r8.json());
                if(r9.ok)setFunnel(await r9.json());
                setLastUpdated(new Date());
                setLoading(false);setError(false);
            }catch(e){setError(true);setLoading(false)}
        },[]);

        useEffect(()=>{fetchBaseline()},[fetchBaseline]);
        useEffect(()=>{if(running)return;const id=setInterval(fetchBaseline,30000);return()=>clearInterval(id)},[running,fetchBaseline]);

        // Auto-run on first load
        useEffect(()=>{if(!loading&&!error&&rep&&!didAutoRun.current){didAutoRun.current=true;if((rep.batch?.cases||0)===0)runBatch()}},[loading,error,rep]);

        // Auto-pilot loop
        useEffect(()=>{if(!autoPilot||running)return;const id=setInterval(()=>{if(!autoPilotRef.current||running)return;runBatch()},15000);return()=>clearInterval(id)},[autoPilot,running]);

        // Keyboard shortcut: Cmd+R / Ctrl+R
        useEffect(()=>{
            const handler=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='r'&&!running){e.preventDefault();runBatch()}};
            window.addEventListener('keydown',handler);return()=>window.removeEventListener('keydown',handler);
        },[running]);

        const runBatch=useCallback(()=>{
            if(running)return;setRunning(true);setProgress({current:0,total:1});setLiveRep(null);
            const wsHost=location.hostname==='rzp-recovery-agent.vercel.app'?'rzp-recovery-agent.onrender.com':location.host;
            const wsProto=location.protocol==='https:'?'wss:':'ws:';
            const ws=new WebSocket(`${wsProto}//${wsHost}/ws/replay?seed=42&cases=200`);
            wsRef.current=ws;
            ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==="start")setProgress({current:0,total:msg.total});else if(msg.type==="progress")setProgress({current:msg.current,total:msg.total});else if(msg.type==="done"){setLiveRep(msg.report);setRunning(false);ws.close();fetch(`${API}/cases/recent?limit=50`).then(r=>r.json()).then(d=>{if(d.cases)setCases(d.cases)}).catch(()=>{});setLastUpdated(new Date());try{window.dispatchEvent(new Event('recovery-complete'))}catch(e){}}else if(msg.type==="error"){setRunning(false);ws.close()}}catch(err){}};
            ws.onerror=()=>setRunning(false);ws.onclose=()=>setRunning(false);
        },[running]);

        const dismissLive=useCallback(()=>setLiveRep(null),[]);
        useEffect(()=>{return()=>{if(wsRef.current)wsRef.current.close()}},[]);

        // Skeleton loader
        if(loading)return(
            <div className="layout">
                <aside className="sidebar"><div className="sidebar-logo"><h1>RR Agent</h1><div className="sub">Revenue Recovery</div></div></aside>
                <div className="main"><div className="content" style={{padding:40}}>
                    <div className="skeleton sk-card" style={{height:180,marginBottom:16}}></div>
                    <div className="metrics">{[1,2,3,4].map(i=><div key={i} className="skeleton sk-card"></div>)}</div>
                    <div className="grid-2">{[1,2].map(i=><div key={i} className="skeleton sk-card" style={{height:260}}></div>)}</div>
                </div></div>
            </div>
        );
        if(error)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{textAlign:"center"}}><p style={{fontSize:16,marginBottom:8}}>Failed to load report</p><p style={{color:"var(--dim)",fontSize:11}}>Start with: <code className="mono">uvicorn app.main:app --port 8000</code></p><button className="btn" style={{marginTop:12}} onClick={fetchBaseline}>Retry</button></div></div>;

        const active=liveRep||rep;
        const hd=active.headline||{},batch=active.batch||{},cost=active.cost||{},perClass=active.per_class||{},promises=active.promises||{};
        const naiveRate=hd.naive_recovery_rate!=null?hd.naive_recovery_rate:null;
        const blocks=active.policy_transparency?.blocked_actions||{};
        const cpir=cost.cost_per_incremental_recovery_paise;

        return(
            <>
            <canvas id="confetti-canvas" style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:999}}/>
            {toast&&<div className="toast">{toast}</div>}

            <div className="layout">
                <aside className="sidebar">
                    <div className="sidebar-logo"><h1>RR Agent</h1><div className="sub">Revenue Recovery</div></div>
                    <nav className="nav">
                        <div className="nav-section">Core</div>
                        {[{id:"hub",icon:"📊",label:"Dashboard"},{id:"ledger",icon:"📋",label:"Case Ledger"},{id:"engine",icon:"⚙️",label:"Engine & ROI"},{id:"tools",icon:"🛠",label:"Tools"},{id:"security",icon:"🛡",label:"Security"}].map(n=><div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}><span className="icon">{n.icon}</span>{n.label}</div>)}
                    </nav>
                    <div className="sidebar-footer">v0.5.0 — Buildathon 2026</div>
                </aside>

                <div className="main">
                    <div className="topbar">
                        <div className="tb-left">
                            {running&&<span className="badge live">LIVE</span>}
                            {running&&<span style={{fontSize:10,color:"var(--blu)"}}>{progress.total>1?`${progress.current}/${progress.total}`:"Running…"}</span>}
                            {!running&&<span className="badge">{batch.cases||"—"} cases</span>}
                            {lastUpdated&&<span style={{fontSize:9,color:"var(--dim)",fontFamily:"var(--mono)"}}>updated {lastUpdated.toLocaleTimeString()}</span>}
                        </div>
                        <div className="tb-right">
                            <div className="sound-toggle" onClick={()=>{setSoundEnabled(!soundEnabled);notify(soundEnabled?"Muted":"Sound on")}}>{soundEnabled?"🔊":"🔇"}</div>
                            <div className={`sound-toggle ${autoPilot?"tag-blue":""}`} onClick={()=>{setAutoPilot(!autoPilot);notify(autoPilot?"Auto-pilot off":"Auto-pilot on")}} style={autoPilot?{borderColor:"rgba(59,130,246,.4)",color:"var(--blu)"}:{}}>
                                {autoPilot?"⚡ AUTO":"⚡ OFF"}
                            </div>
                            <button className="btn btn-sm btn-outline" onClick={fetchBaseline} disabled={running}>↻</button>
                            <button className="btn btn-sm" onClick={runBatch} disabled={running}>{running?"Running…":"Run Batch"}</button>
                        </div>
                    </div>

                    <div className="content">
                        {tab==="hub"&&<HubTab hd={hd} batch={batch} cost={cost} perClass={perClass} promises={promises} blocks={blocks} cpir={cpir} naiveRate={naiveRate} cases={cases} running={running} progress={progress} liveRep={liveRep} dismissLive={dismissLive} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API} funnel={funnel} approval={approval} budget={budget}/>}
                        {tab==="ledger"&&<LedgerTab cases={cases} onCaseClick={id=>{setSelectedCase(id);setAuditOpen(true)}} API={API}/>}
                        {tab==="engine"&&<EngineTab bandit={bandit} cusum={cusum} budget={budget} incidents={incidents} API={API} notify={notify}/>}
                        {tab==="tools"&&<ToolsTab API={API} notify={notify}/>}
                        {tab==="security"&&<SecurityTab security={security} API={API} notify={notify}/>}
                    </div>
                </div>
            </div>

            <AuditModal open={auditOpen} onClose={()=>setAuditOpen(false)} caseId={selectedCase} API={API}/>
            </>
        );
    }

    // ── Hub Tab ──
    function HubTab({hd,batch,cost,perClass,promises,blocks,cpir,naiveRate,cases,running,progress,liveRep,dismissLive,onCaseClick,API,funnel,approval,budget}){
        const ci=hd.incremental_recovery_ci95_pp||[0,0];
        const lift=hd.incremental_recovery_pp||0;
        const classRef=useRef(null);
        const spendRef=useRef(null);
        const charts=useRef({});

        useEffect(()=>{
            if(charts.current.cls)charts.current.cls.destroy();
            const entries=Object.entries(perClass).sort((a,b)=>b[1].lift_pp-a[1].lift_pp);
            if(entries.length&&classRef.current){
                charts.current.cls=new Chart(classRef.current,{type:"bar",data:{labels:entries.map(([c])=>c.replace(/_/g," ").toLowerCase()),datasets:[{label:"Treatment %",data:entries.map(([,d])=>pct(d.treatment_rate,1)),backgroundColor:"#3b82f6",borderRadius:3},{label:"Control %",data:entries.map(([,d])=>pct(d.control_rate,1)),backgroundColor:"#64748b",borderRadius:3}]},options:{responsive:true,plugins:{legend:{labels:{color:"#94a3b8",font:{size:10}}}},scales:{x:{ticks:{color:"#94a3b8",font:{size:9}},grid:{color:"rgba(255,255,255,0.04)"}},y:{beginAtZero:true,max:100,ticks:{color:"#94a3b8",callback:v=>v+"%"},grid:{color:"rgba(255,255,255,0.04)"}}}}});
            }
            if(charts.current.spend)charts.current.spend.destroy();
            const chs=Object.entries(cost.cost_by_channel_paise||{}).filter(([,v])=>v>0).map(([k,v])=>({n:k[0].toUpperCase()+k.slice(1),v}));
            if(chs.length&&spendRef.current){
                charts.current.spend=new Chart(spendRef.current,{type:"doughnut",data:{labels:chs.map(c=>`${c.n} · ${fmt(c.v)}`),datasets:[{data:chs.map(c=>c.v),backgroundColor:["#38bdf8","#4ade80","#fbbf24","#f87171","#a78bfa"]}]},options:{responsive:true,cutout:"55%",plugins:{legend:{position:"bottom",labels:{color:"#94a3b8",padding:10,font:{size:10}}}}}});
            }
        },[perClass,cost]);

        return(
            <>
                {liveRep&&<div style={{background:"rgba(59,130,246,.06)",border:"1px solid rgba(59,130,246,.2)",borderRadius:8,padding:"7px 12px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11}}>
                    <span style={{color:"var(--blu)",fontWeight:600}}>LIVE results from batch run</span>
                    <button className="btn btn-xs btn-outline" onClick={dismissLive}>Show baseline</button>
                </div>}

                {/* Hero */}
                <div className="hero a-fu">
                    <div>
                        <div className="h-label">Incremental recovery vs control</div>
                        <div className="h-amt">{fmt(hd.incremental_money_paise)}</div>
                        <div className="h-sub">+{lift.toFixed(1)} percentage points lift</div>
                        <div className="h-ci">95% CI [+{ci[0]}, +{ci[1]}] · 2,000 bootstrap resamples</div>
                    </div>
                    <div>
                        <div className="bar-g"><div className="bar-l"><span>Treatment (agent)</span><span>{pct(hd.recovery_rate_treatment)}%</span></div><div className="bar"><div className="bf t" style={{width:pct(hd.recovery_rate_treatment)+"%"}}></div></div></div>
                        <div className="bar-g"><div className="bar-l"><span>Control (no agent)</span><span>{pct(hd.recovery_rate_control)}%</span></div><div className="bar"><div className="bf c" style={{width:pct(hd.recovery_rate_control)+"%"}}></div></div></div>
                        {naiveRate!=null&&<div className="bar-g"><div className="bar-l"><span>Naive retry</span><span>{pct(naiveRate)}%</span></div><div className="bar"><div className="bf n" style={{width:pct(naiveRate)+"%"}}></div></div></div>}
                        <div className="h-delta"><div className="h-dv">+{fmt(hd.incremental_money_paise)}</div><div className="h-dl">incremental money recovered</div></div>
                    </div>
                </div>

                {/* Metrics */}
                <div className="metrics">
                    <div className="metric a-fu d1"><div className="metric-label">Recovery rate</div><div className="metric-value tabular">{pct(hd.recovery_rate_treatment)}%</div><div className="metric-sub">control {pct(hd.recovery_rate_control)}%</div></div>
                    <div className="metric a-fu d2"><div className="metric-label">Incremental lift</div><div className="metric-value tabular" style={{color:"var(--grn)"}}>+{(hd.incremental_recovery_pp||0).toFixed(1)} pp</div><div className="metric-sub">95% CI [+{ci[0]}, +{ci[1]}]</div></div>
                    <div className="metric primary a-fu d3"><div className="metric-label">Money recovered</div><div className="metric-value tabular">{fmt(hd.incremental_money_paise)}</div><div className="metric-sub">incremental vs control</div></div>
                    <div className="metric a-fu d4"><div className="metric-label">Amount at risk</div><div className="metric-value tabular">{fmt(batch.amount_at_risk_paise)}</div><div className="metric-sub">across {batch.cases} cases</div></div>
                </div>

                {/* Recovery Funnel */}
                {funnel&&funnel.stages&&<div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>Recovery Funnel</h2></div>
                    <div className="card-body">
                        <div className="funnel">
                            {funnel.stages.map((s,i)=>(
                                <Fragment key={i}>
                                    {i>0&&<span className="funnel-arrow">→</span>}
                                    <div className="funnel-stage">
                                        <div className="funnel-num" style={{color:i===funnel.stages.length-1?"var(--grn)":"var(--txt)"}}>{s.count}</div>
                                        <div className="funnel-label">{s.label}</div>
                                        {s.dropoff_pct!=null&&<div style={{fontSize:8,color:"var(--red)",marginTop:2}}>-{s.dropoff_pct.toFixed(0)}%</div>}
                                    </div>
                                </Fragment>
                            ))}
                        </div>
                    </div>
                </div>}

                {/* Compliance + Approval */}
                <div className="grid-4" style={{marginBottom:16}}>
                    <div className="card card-body a-fu d1"><div className="metric-label">Redundant contacts</div><div className="metric-value tabular">{pct(cost.redundant_contact_share,0)}%</div><div className="metric-sub">would have paid anyway</div></div>
                    <div className="card card-body a-fu d2"><div className="metric-label">Opt-outs honored</div><div className="metric-value tabular">{cost.opt_outs||0}</div><div className="metric-sub">every one respected</div></div>
                    <div className="card card-body a-fu d3"><div className="metric-label">Promises-to-pay</div><div className="metric-value tabular">{promises.received||0}</div><div className="metric-sub">{promises.keep_rate!=null?pct(promises.keep_rate,0)+"% keep":"none yet"}</div></div>
                    <div className="card card-body a-fu d4"><div className="metric-label">Cost per recovery</div><div className="metric-value tabular">{cpir!=null?fmt(cpir):"—"}</div><div className="metric-sub">{cost.contacts_executed||0} contacts</div></div>
                </div>

                {/* Approval Queue inline */}
                {approval&&approval.count>0&&<div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>✋ Approval Queue</h2><span className="badge warn">{approval.count} pending</span></div>
                    <div className="card-body">
                        {(approval.queue||[]).slice(0,3).map(c=><div key={c.case_id} className="approval-row">
                            <div><span style={{fontWeight:600}}>{c.customer}</span><span style={{color:"var(--dim)",marginLeft:6,fontSize:10}}>{label(c.failure_class)}</span></div>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <span className="mono tabular" style={{fontWeight:700}}>{fmt(c.amount_paise)}</span>
                                <button className="btn btn-xs btn-grn" onClick={async()=>{await fetch(`${API}/approval/${c.case_id}/approve`,{method:"POST"});notify("Approved");fetchBaseline?.()}}>Approve</button>
                                <button className="btn btn-xs btn-red" onClick={async()=>{await fetch(`${API}/approval/${c.case_id}/reject`,{method:"POST"});notify("Rejected")}}>Reject</button>
                            </div>
                        </div>)}
                    </div>
                </div>}

                {/* Charts */}
                <div className="grid-2" style={{marginBottom:16}}>
                    <div className="card a-fu d5"><div className="card-header"><h2>Recovery by failure class</h2></div><div className="card-body"><canvas ref={classRef} height="200"></canvas></div></div>
                    <div className="card a-fu d6"><div className="card-header"><h2>Spend by channel</h2></div><div className="card-body">{Object.keys(cost.cost_by_channel_paise||{}).length?<canvas ref={spendRef} height="200"></canvas>:<p style={{color:"var(--dim)",textAlign:"center",padding:"50px 0",fontSize:11}}>No spend recorded</p>}</div></div>
                </div>

                {/* Policy blocks */}
                <div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>Policy gates that blocked actions</h2></div>
                    <div className="card-body"><div className="chips">{Object.entries(blocks).length?Object.entries(blocks).map(([k,v])=>(<span className="chip" key={k}>{esc(k)} · {v}</span>)):<span className="chip ok">no blocked actions</span>}</div></div>
                </div>

                {/* Cases */}
                <div className="card a-fu" style={{marginBottom:16}}>
                    <div className="card-header"><h2>Recent cases</h2><span style={{fontSize:9,color:"var(--dim)"}}>click for audit trail</span></div>
                    <div style={{overflowX:"auto"}}>
                        <table><thead><tr><th>Case</th><th>Class</th><th>Amount</th><th>Status</th><th>Recovered</th></tr></thead>
                        <tbody>{cases.slice(0,12).length?cases.slice(0,12).map(c=><tr key={c.case_id} onClick={()=>onCaseClick(c.case_id)} style={{cursor:"pointer"}}>
                            <td className="mono">{c.case_id.slice(0,12)}</td><td>{label(c.failure_class)}</td><td className="tabular">{fmt(c.amount_paise)}</td>
                            <td><span className={`pill ${c.status}`}>{c.status.replace(/_/g," ")}</span></td><td className="tabular">{c.recovered_amount_paise?fmt(c.recovered_amount_paise):"—"}</td>
                        </tr>):<tr><td colSpan="5" style={{color:"var(--dim)"}}>no cases yet</td></tr>}</tbody></table>
                    </div>
                </div>

                {/* Features */}
                <div className="feat-grid" style={{marginBottom:16}}>
                    <div className="feat-item"><div className="feat-icon">📊</div><div className="feat-title">Incremental Lift</div><div className="feat-desc">Control group absorbs organic recoveries. Bootstrap 95% CI.</div></div>
                    <div className="feat-item"><div className="feat-icon">🛡</div><div className="feat-title">Compliance Gates</div><div className="feat-desc">Quiet hours, attempt caps, cooldowns, opt-outs, human approval.</div></div>
                    <div className="feat-item"><div className="feat-icon">🧠</div><div className="feat-title">ML + SHAP</div><div className="feat-desc">HistGradientBoosting with explainable SHAP values.</div></div>
                    <div className="feat-item"><div className="feat-icon">🎰</div><div className="feat-title">UCB1 Bandit</div><div className="feat-desc">Multi-armed bandit picks best channel per failure class.</div></div>
                    <div className="feat-item"><div className="feat-icon">🔗</div><div className="feat-title">Audit Trail</div><div className="feat-desc">SHA-256 hash chain. Tamper-evident.</div></div>
                    <div className="feat-item"><div className="feat-icon">📈</div><div className="feat-title">CUSUM Detector</div><div className="feat-desc">Page's CUSUM for success-rate shifts.</div></div>
                </div>
            </>
        );
    }

    // ── Ledger Tab ──
    function LedgerTab({cases,onCaseClick,API}){
        const[search,setSearch]=useState("");
        const[expandedId,setExpandedId]=useState(null);
        const filtered=cases.filter(c=>{if(!search)return true;const q=search.toLowerCase();return c.case_id.toLowerCase().includes(q)||(c.failure_class||"").toLowerCase().includes(q)||(c.status||"").toLowerCase().includes(q)});
        const exportCsv=useCallback(()=>{
            const rows=[["Case ID","Failure Class","Amount","Status","Group","Recovered"]];
            cases.forEach(c=>rows.push([c.case_id,c.failure_class,c.amount_paise,c.status,c.group||"",c.recovered_amount_paise||""]));
            const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
            const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recovery_ledger.csv";a.click();
        },[cases]);

        return(
            <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

                        <div className="sec-grid">
                            <div className="sec-box"><div className="sec-label">Threats Mitigated</div><div className="sec-val" style={{color:"var(--grn)"}}>{security.threat_model?.mitigated}/{security.threat_model?.total}</div></div>
                            <div className="sec-box"><div className="sec-label">Adversarial Test</div><div className="sec-val" style={{color:security.adversarial_test?.pass?"var(--grn)":"var(--red)"}}>{security.adversarial_test?.pass?"PASS":"FAIL"}</div></div>
                            <div className="sec-box"><div className="sec-label">Audit Chain</div><div className="sec-val" style={{color:security.audit_chain?.valid?"var(--grn)":"var(--red)"}}>{security.audit_chain?.valid?"VALID":"BROKEN"}</div><div style={{fontSize:9,color:"var(--dim)"}}>{security.audit_chain?.total_links} links</div></div>
                        </div>
                        {security.adversarial_test&&<div style={{background:"rgba(34,197,94,.06)",border:"1px solid rgba(34,197,94,.15)",borderRadius:6,padding:"8px 12px",fontSize:11,color:"var(--grn)",marginTop:10}}>
                            ✅ {security.adversarial_test.cases_tested} adversarial cases · {security.adversarial_test.cases_terminated} terminated · 0 violations
                        </div>}
                    </div>
                </div>}

                <div className="grid-2" style={{marginBottom:16}}>
                    {/* Adversarial Test */}
                    <div className="card">
                        <div className="card-header"><h2>🧪 Adversarial LLM Test</h2></div>
                        <div className="card-body">
                            <p style={{fontSize:10,color:"var(--dim)",marginBottom:10}}>Tests prompt injection resistance and policy bypass attempts.</p>
                            <button className="btn btn-sm btn-red" onClick={runAdversarial} disabled={testing}>{testing?"Running…":"Run Adversarial Test"}</button>
                            {adversarialResult&&<div style={{background:"#0a0f1a",padding:10,borderRadius:5,fontFamily:"var(--mono)",fontSize:10,whiteSpace:"pre-wrap",maxHeight:200,overflow:"auto",marginTop:10}}>{JSON.stringify(adversarialResult,null,2)}</div>}
                        </div>
                    </div>

                    {/* Audit Chain */}
                    <div className="card">
                        <div className="card-header"><h2>🔗 Audit Chain Verification</h2></div>
                        <div className="card-body">
                            <p style={{fontSize:10,color:"var(--dim)",marginBottom:10}}>Verifies SHA-256 hash chain integrity across all audit events.</p>
                            <button className="btn btn-sm" onClick={verifyChain}>Verify Chain</button>
                            {chainResult&&<div style={{marginTop:10}}>
                                <div className="grid-3" style={{gap:6}}>
                                    <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5,textAlign:"center"}}><div className="sec-label">Valid</div><div className="sec-val" style={{color:chainResult.valid?"var(--grn)":"var(--red)",fontSize:14}}>{chainResult.valid?"YES":"NO"}</div></div>
                                    <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5,textAlign:"center"}}><div className="sec-label">Links</div><div className="sec-val" style={{fontSize:14}}>{chainResult.total_links}</div></div>
                                    <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5,textAlign:"center"}}><div className="sec-label">Broken At</div><div className="sec-val" style={{color:chainResult.broken_at_index===null?"var(--grn)":"var(--red)",fontSize:14}}>{chainResult.broken_at_index===null?"None":chainResult.broken_at_index}</div></div>
                                </div>
                            </div>}
                        </div>
                    </div>
                </div>

                {/* Threat Model */}
                {security?.threat_model?.threats&&<div className="card">
                    <div className="card-header"><h2>Threat Model</h2></div>
                    <div style={{overflowX:"auto"}}>
                        <table><thead><tr><th>Threat</th><th>Severity</th><th>Mitigation</th><th>Status</th></tr></thead>
                        <tbody>{security.threat_model.threats.map((t,i)=>(
                            <tr key={i}><td style={{fontWeight:600}}>{t.name}</td><td><span className={`tag ${t.severity==="critical"?"tag-red":t.severity==="high"?"tag-yellow":"tag-blue"}`}>{t.severity}</span></td><td style={{fontSize:10,color:"var(--dim)"}}>{t.mitigation}</td><td><span className="tag tag-green">mitigated</span></td></tr>
                        ))}</tbody></table>
                    </div>
                </div>}
            </>
        );
    }

    // ── Audit Modal ──
    function AuditModal({open,onClose,caseId,API}){
        const[detail,setDetail]=useState(null);
        const[loading,setLoading]=useState(true);
        const[decision,setDecision]=useState(null);
        const modalRef=useRef(null);

        useEffect(()=>{if(caseId){setLoading(true);setDecision(null);Promise.all([
            fetch(`${API}/cases/${caseId}/detail`).then(r=>r.ok?r.json():null),
            fetch(`${API}/cases/${caseId}/decision`).then(r=>r.ok?r.json():null).catch(()=>null),
        ]).then(([d,dec])=>{setDetail(d);setDecision(dec);setLoading(false)}).catch(()=>setLoading(false))}},[caseId,API]);

        // Escape key handler
        useEffect(()=>{if(!open)return;const handler=e=>{if(e.key==="Escape")onClose()};window.addEventListener("keydown",handler);return()=>window.removeEventListener("keydown",handler)},[open,onClose]);

        if(!open)return null;
        const actorColor={"classifier":"var(--blu)","selector":"var(--pur)","executor":"var(--grn)","policy":"var(--yel)","system":"var(--dim)"};
        const eventIcon={"case.created":"📝","action.scheduled":"⏰","action.executed":"▶️","action.deferred":"⏸️","action.blocked":"🚫","case.written_off":"🗑️","case.recovered":"✅"};

        return(
            <div className="modal on" onClick={e=>{if(e.target===e.currentTarget)onClose()}} ref={modalRef}>
                <div className="modal-c" style={{maxWidth:750,maxHeight:"85vh",overflow:"auto"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                        <h2>Audit Trail{detail?" — "+detail.case?.case_id:""}</h2>
                        <button className="btn btn-sm btn-outline" onClick={onClose}>✕</button>
                    </div>
                    {loading?<div style={{textAlign:"center",padding:30}}><div className="spinner"></div><div style={{fontSize:11,color:"var(--dim)"}}>Loading…</div></div>
                    :!detail?<div style={{textAlign:"center",padding:30,color:"var(--red)"}}>Failed to load</div>
                    :<>
                        <div className="grid-3" style={{gap:6,marginBottom:14}}>
                            <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5}}><div className="form-label">Failure</div><div style={{fontSize:12,fontWeight:600}}>{label(detail.case?.failure_class)}</div></div>
                            <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5}}><div className="form-label">Amount</div><div className="mono tabular" style={{fontSize:12,fontWeight:600}}>{detail.case?.amount_paise?fmt(detail.case.amount_paise):"—"}</div></div>
                            <div style={{background:"rgba(255,255,255,.04)",padding:8,borderRadius:5}}><div className="form-label">Status</div><span className={`pill ${detail.case?.status}`}>{detail.case?.status?.replace(/_/g," ")}</span></div>
                        </div>

                         {/* Decision Inspector */}
                        {decision&&<div style={{border:"1px solid var(--bdr)",borderRadius:8,padding:12,marginBottom:14,background:"rgba(255,255,255,.02)"}}>
                            <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>🧠 Decision Inspector</div>
                            <div className="grid-3" style={{gap:6,marginBottom:8}}>
                                <div style={{background:"rgba(255,255,255,.04)",padding:6,borderRadius:4,textAlign:"center"}}><div className="form-label">Selected Action</div><div className="mono" style={{fontSize:12,fontWeight:700,color:"var(--grn)"}}>{decision.selected_action||"—"}</div></div>
                                <div style={{background:"rgba(255,255,255,.04)",padding:6,borderRadius:4,textAlign:"center"}}><div className="form-label">Failure Class</div><div className="mono" style={{fontSize:12,fontWeight:700}}>{decision.failure_class||"—"}</div></div>
                                <div style={{background:"rgba(255,255,255,.04)",padding:6,borderRadius:4,textAlign:"center"}}><div className="form-label">Amount</div><div className="mono" style={{fontSize:12,fontWeight:700}}>{decision.amount_paise?`₹${(decision.amount_paise/100).toLocaleString()}`:"—"}</div></div>
                            </div>
                            {decision.selected_reasoning&&<div style={{background:"rgba(255,255,255,.04)",padding:6,borderRadius:4,marginBottom:8,fontSize:10}}><span style={{fontWeight:700}}>Why: </span>{decision.selected_reasoning.reason||JSON.stringify(decision.selected_reasoning)}</div>}
                            {decision.alternatives&&decision.alternatives.length>0&&<div>
                                <div style={{fontSize:9,color:"var(--dim)",marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"}}>Alternatives ({decision.alternatives.length})</div>
                                {decision.alternatives.filter(a=>!a.selected).slice(0,5).map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:"1px solid rgba(255,255,255,.04)",fontSize:10}}>
                                    <span>{r.action}</span><span className="mono" style={{color:"var(--dim)"}}>net EV: ₹{r.net_ev_paise}</span><span style={{fontSize:9,color:r.rejected_reason?"var(--red)":"var(--dim)"}}>{r.rejected_reason||""}</span>
                                </div>)}
                            </div>}
                        </div>}

                        {/* Event Log */}
                        <div style={{borderTop:"1px solid var(--bdr)",paddingTop:10}}>
                            <div style={{fontSize:10,fontWeight:600,color:"var(--dim)",marginBottom:6,textTransform:"uppercase",letterSpacing:".04em"}}>Event Log ({detail.audit?.length||0})</div>
                            <div style={{maxHeight:350,overflowY:"auto"}}>
                                {detail.audit?.map(e=>(
                                    <div key={e.event_id} style={{display:"flex",gap:8,padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,.04)",fontSize:11}}>
                                        <div style={{width:120,color:"var(--dim)",fontSize:9,whiteSpace:"nowrap",fontFamily:"var(--mono)"}}>{new Date(e.ts).toLocaleString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",day:"2-digit",month:"short"})}</div>
                                        <div style={{width:60,fontWeight:600,fontSize:9,textTransform:"uppercase",color:actorColor[e.actor]||"var(--dim)"}}>{e.actor}</div>
                                        <div style={{flex:1}}>
                                            <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:1}}><span>{eventIcon[e.event_type]||"📌"}</span><span style={{fontWeight:600,textTransform:"capitalize",fontSize:10}}>{e.event_type.replace(/[._]/g," ")}</span></div>
                                            <div style={{color:"var(--dim)",fontSize:10,marginLeft:16}}>
                                                {e.event_type==="case.created"&&`classified as ${e.classified_as} (${(e.confidence*100).toFixed(0)}%) — ${e.error_description}`}
                                                {e.event_type==="action.scheduled"&&`${e.type} in ${e.delay_min}min — P(recovery) ${(e.recovery_probability*100).toFixed(1)}% — ${e.why}`}
                                                {e.event_type==="action.executed"&&`${e.type} — ${e.decision}: ${e.reason}`}
                                                {e.event_type==="action.blocked"&&`blocked — ${e.reason}`}
                                                {e.event_type==="case.written_off"&&`written off — ${e.reason}`}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </>}
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
</body>
</html>
