version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    actions-and-tooling:
      patterns:
      - actions/*
      - docker/*
      - codecov/*
      - oven-sh/*
      - github/*
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    actions-and-tooling:
      patterns:
      - actions/*
      - docker/*
      - codecov/*
      - oven-sh/*
      - github/*
