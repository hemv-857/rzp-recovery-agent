name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          # Pinned: an unpinned ruff silently changes which rules fire on
          # release, which turned this pipeline red on 0.17.0 (UP017/UP042).
          # Bump it deliberately, in a PR.
          pip install 'ruff==0.17.0'
          ruff check .
      - name: Offline batch smoke (500 cases)
        run: |
          python - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open("config.yaml"))
          cfg["simulation"]["batch_size"] = 500
          yaml.safe_dump(cfg, open("config.yaml", "w"))
          EOF
          python scripts/run_batch.py
      - run: python -m pytest tests -q
