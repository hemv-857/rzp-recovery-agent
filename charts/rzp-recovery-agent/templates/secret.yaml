{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  AGENT_API_TOKEN: {{ .Values.agentToken | default (randAlphaNum 32) | quote }}
  {{- if .Values.razorpay.keySecret }}
  RAZORPAY_KEY_SECRET: {{ .Values.razorpay.keySecret | quote }}
  {{- end }}
  {{- if .Values.razorpay.webhookSecret }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.razorpay.webhookSecret | quote }}
  {{- end }}
{{- end }}
