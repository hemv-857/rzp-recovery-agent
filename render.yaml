services:
  - type: web
    name: rzp-recovery-agent
    runtime: Docker
    dockerfilePath: Dockerfile
    envVars:
      - key: RECOVERY_DB
        value: /data/recovery.db
      - key: RAZORPAY_WEBHOOK_SECRET
        value: demo_secret
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13
    disk:
      name: rzp-data
      mountPath: /data
    healthCheckPath: /report
    autoDeploy: true
